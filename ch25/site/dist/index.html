/* ===== views ===== */
const DAY = 86400000;
const INTV = [1, 3, 7, 16, 35];
const SESSION = { miss: {} };

/* ---------- derived data ---------- */
const QINDEX = {}, FINDEX = {};
function indexContent() {
  MODULES.forEach(m => {
    const c = CONTENT[m.id]; if (!c) return;
    c.steps.forEach((s, i) => { if (s.t === 'q') QINDEX[s.q.id] = { q: s.q, mid: m.id, i }; });
    (c.flash || []).forEach(f => FINDEX[f.id] = Object.assign({ mid: m.id }, f));
  });
}
function ready(mid) { return !!CONTENT[mid]; }
function modById(mid) { return MODULES.find(m => m.id === mid); }

function flowOf(mid) {
  const c = CONTENT[mid];
  let st = c.steps.map((s, i) => Object.assign({ _i: i }, s));
  if (S.set.qmode === 'end') {
    const qs = st.filter(s => s.t === 'q');
    st = st.filter(s => s.t !== 'q');
    if (qs.length) st.push({ t: 'qhead', _i: -1 }, ...qs);
  }
  return [{ t: 'intro', _i: -1 }, ...st, { t: 'lockin', _i: -1 }, { t: 'recall', _i: -1 }, { t: 'hooks', _i: -1 }, { t: 'done', _i: -1 }];
}
function stepKey(s) { return s.t === 'q' ? s.q.id : s.id; }
function prog(mid) { return S.prog[mid] || (S.prog[mid] = { at: 0, seen: {}, ix: {}, done: false }); }
function modPct(mid) {
  if (!ready(mid)) return 0;
  const c = CONTENT[mid], p = S.prog[mid];
  if (!p) return 0;
  const keys = c.steps.map(stepKey);
  return pct(keys.filter(k => p.seen[k]).length, keys.length);
}
function accuracy() {
  let r = 0, t = 0;
  Object.values(S.qs).forEach(x => { t++; if (x.ok) r++; });
  return t ? pct(r, t) : null;
}

/* ---------- SRS ---------- */
function availableCards() {
  const out = [];
  MODULES.forEach(m => { if (S.started[m.id] && CONTENT[m.id]) (CONTENT[m.id].flash || []).forEach(f => out.push(FINDEX[f.id])); });
  return out;
}
function dueQueue() {
  const now = Date.now();
  const cards = availableCards();
  const lapsed = [], due = [], fresh = [];
  cards.forEach(c => {
    const s = S.srs[c.id];
    if (!s) fresh.push(c);
    else if (s.b === -1) lapsed.push(c);
    else if (s.due <= now) due.push(c);
  });
  due.sort((a, b) => S.srs[a.id].due - S.srs[b.id].due);
  return [...lapsed, ...due, ...fresh];
}
function gradeCard(id, ok) {
  const s = S.srs[id];
  if (ok) {
    const b = !s || s.b < 0 ? 0 : Math.min(s.b + 1, 4);
    S.srs[id] = { b, due: Date.now() + INTV[b] * DAY };
  } else {
    S.srs[id] = { b: -1, due: Date.now(), lapsed: true };
  }
  save();
}
function nextDueText() {
  const future = availableCards().map(c => S.srs[c.id]).filter(s => s && s.b >= 0).map(s => s.due);
  if (!future.length) return '';
  const d = Math.min(...future) - Date.now();
  if (d <= 0) return 'now';
  const h = Math.round(d / 3600000);
  return h < 24 ? `in ${Math.max(1, h)} h` : `in ${Math.round(d / DAY)} day${Math.round(d / DAY) > 1 ? 's' : ''}`;
}

/* ---------- router ---------- */
const R = { view: 'home', params: {}, stack: [] };
function go(view, params = {}, replace = false) {
  if (!replace) R.stack.push({ view: R.view, params: R.params });
  R.view = view; R.params = params;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });

function back() {
  const p = R.stack.pop();
  if (p) { R.view = p.view; R.params = p.params; } else { R.view = 'home'; R.params = {}; }
  render();
  window.scrollTo(0, 0);
}

/* ---------- flow-cell strip for the home analyzer: red cells drifting through a capillary ---------- */
function flowStrip() {
  let cells = '';
  for (let i = 0; i < 18; i++) {
    const x = Math.round(i * 600 / 18 + (i * 13 % 17)), y = 13 + (i * 37 % 21), r = 5 + (i % 3), d = ((i * 0.83) % 7).toFixed(2);
    const kind = i % 7 === 3 ? 'wbc' : i % 5 === 2 ? 'plt' : 'rbc';
    const st = `style="--x:${x}px;animation-delay:-${d}s"`;
    cells += kind === 'rbc' ? `<ellipse class="rbc" cx="${x}" cy="${y}" rx="${r + 2.5}" ry="${r}" ${st}/>`
      : kind === 'wbc' ? `<circle class="wbc" cx="${x}" cy="${y}" r="${r + 2}" ${st}/>`
      : `<circle class="plt" cx="${x}" cy="${y}" r="2.2" ${st}/>`;
  }
  return `<svg class="flow" viewBox="0 0 600 46" preserveAspectRatio="xMinYMid slice" aria-hidden="true"><path class="wall" d="M0 3H600M0 43H600"/>${cells}</svg>`;
}

/* ---------- module player ---------- */
function openModule(mid, at) {
  if (!ready(mid)) return;
  S.started[mid] = true;
  const p = prog(mid);
  if (at != null) p.at = at;
  save();
  go('module', { mid });
}

VIEWS.module = (app, { mid }) => {
  const mod = modById(mid), c = CONTENT[mid], p = prog(mid);
  const flow = flowOf(mid);
  if (p.at >= flow.length) p.at = flow.length - 1;
  if (p.at < 0) p.at = 0;
  const step = flow[p.at];
  S.last = { mid }; save();
  const counts = { card: 0, ix: 0, q: 0 };
  c.steps.forEach(s => counts[s.t]++);
  const tb = topBar(mod.title, `Module ${mod.n} · ${stepLabel(step, flow, p.at)}`, { back: true, close: true, onBack: () => { R.stack = []; go('home', {}, true); }, progress: Math.round(100 * p.at / (flow.length - 1)) });
  const arb = el(`<button class="ibtn txt" aria-label="Arabic summary">ع</button>`);
  arb.onclick = () => go('arabic', { mid });
  $('.acts', tb).appendChild(arb);
  app.appendChild(tb);
  const m = mainEl(); app.appendChild(m);
  const wrap = el('<section class="step"></section>'); m.appendChild(wrap);

  let canGo = true;
  const bar = el(`<div class="stepbar"><div class="row">
    <button class="btn ghost small" data-prev aria-label="Previous step" ${p.at === 0 ? 'disabled' : ''}>${I.prev}</button>
    <span class="count">${p.at + 1} / ${flow.length}</span>
    <button class="btn primary" data-next>Continue ${I.next}</button></div></div>`);
  const nextBtn = $('[data-next]', bar);
  function setNext(label, enabled = true) { nextBtn.innerHTML = `${label} ${I.next}`; nextBtn.disabled = !enabled; canGo = enabled; }
  $('[data-prev]', bar).onclick = () => { p.at = Math.max(0, p.at - 1); save(); render(); window.scrollTo(0, 0); };
  nextBtn.onclick = () => {
    if (!canGo) return;
    const k = step.t === 'card' || step.t === 'ix' || step.t === 'q' ? stepKey(step) : null;
    if (k) p.seen[k] = 1;
    if (p.at < flow.length - 1) { p.at++; save(); render(); window.scrollTo(0, 0); }
    else { p.done = true; p.at = 0; save(); R.stack = []; go('home', {}, true); }
  };
  app.appendChild(bar);

  const R_ = STEP_RENDER[step.t];
  R_(wrap, step, { mid, mod, c, p, flow, setNext, counts });
};

function stepLabel(step, flow, at) {
  const names = { intro: 'Overview', card: 'Learn', ix: 'Interactive', q: 'Check yourself', qhead: 'Question round', lockin: 'Lock-in round', recall: 'Recall from memory', hooks: 'Memory hooks', done: 'Module complete' };
  return names[step.t] || '';
}

STEP_RENDER.lockin = (w, s, { mid, setNext }) => {
  const ids = new Set([...(SESSION.miss[mid] || [])]);
  Object.keys(S.mist).forEach(id => { if (QINDEX[id] && QINDEX[id].mid === mid) ids.add(id); });
  w.appendChild(el(`<div class="kind"><span class="tag check">Lock-in round</span></div>`));
  if (!ids.size) {
    w.appendChild(el(`<h2>Nothing to lock in</h2>`));
    w.appendChild(el(`<p class="lede">You have no open misses in this module. Next: recall it all from memory.</p>`));
    return;
  }
  const queue = shuffle([...ids]);
  const total = queue.length;
  w.appendChild(el(`<h2>Your misses, once more</h2>`));
  const info = el(`<p class="lede">Each question you missed comes back until you get it right. <span class="mono muted" data-left></span></p>`);
  w.appendChild(info);
  const host = el('<div></div>'); w.appendChild(host);
  setNext('Finish the round first', false);
  const skip = el(`<button class="btn ghost small" style="justify-self:start">Skip the round</button>`);
  skip.onclick = () => setNext('Continue');
  w.appendChild(skip);
  function nextQ() {
    host.innerHTML = '';
    $('[data-left]', info).textContent = `${total - queue.length}/${total} locked`;
    if (!queue.length) {
      sfx.win();
      host.appendChild(winBar('All misses locked in', null));
      SESSION.miss[mid] = new Set();
      setNext('Continue'); skip.remove(); return;
    }
    const id = queue.shift();
    renderQ(QINDEX[id].q, host, {
      onAnswer: ok => {
        if (!ok) queue.push(id);

        nb.onclick = nextQ; host.appendChild(nb);
      }
    });
  }
  nextQ();
};

function runCards(m, queue, practice = false) {
  queue = queue.slice();
  const total = queue.length;
  let done = 0, got = 0;
  const host = el('<div></div>'); m.appendChild(host);
  function show() {
    host.innerHTML = '';
    if (!queue.length) {
      sfx.win();
      host.appendChild(el(`<div class="done"><span class="tag teach">Session done</span><div class="big">${got}/${done}</div><p class="muted">remembered on the first go${practice ? ' (practice does not change your schedule)' : ''}</p></div>`));
      const b = el(`<button class="btn block" style="margin-top:14px">Back to flashcards</button>`); b.onclick = () => go('cards', {}, true);
      host.appendChild(b); return;
    }
    const c = queue[0];
    const mod = modById(c.mid);
    const card = el(`<div class="fc" role="button" tabindex="0" aria-label="Flashcard. Tap to flip.">
      <div class="inner"><div class="face"><span class="eyebrow">Module ${mod.n} · question</span><div class="t">${c.f}</div><div class="meta"><span>tap to flip</span><span>${queue.length} left</span></div></div>
      <div class="face back"><span class="eyebrow">Answer</span><div class="b">${c.b}</div><div class="meta"><span>${esc(mod.title)}</span><span>${boxLabel(c.id)}</span></div></div></div></div>`);
    const flip = () => { card.classList.toggle('flipped'); btns.hidden = false; sfx.tap(); };
    card.onclick = flip; card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
    const btns = el(`<div class="fcbtns" hidden><button class="btn again">${I.x} Again</button><button class="btn got">${I.check} Got it</button></div>`);
    const [again, ok] = $$('button', btns);
    again.onclick = () => { if (!practice) gradeCard(c.id, false); queue.shift(); queue.splice(Math.min(3, queue.length), 0, c); if (!c._seen) { done++; c._seen = 1; } sfx.bad(); show(); };
    ok.onclick = () => { if (!practice) gradeCard(c.id, true); queue.shift(); if (!c._seen) { done++; got++; } delete c._seen; sfx.ok(); show(); };
    host.appendChild(card); host.appendChild(btns);
  }
  show();
}
function boxLabel(id) { const s = S.srs[id]; if (!s) return 'new'; if (s.b < 0) return 'relearning'; return `box ${s.b + 1} · ${INTV[s.b]}d`; }

/* ---------- search ---------- */
let SEARCH = null;
function buildSearch() {
  SEARCH = [];
  MODULES.forEach(m => {
    const c = CONTENT[m.id]; if (!c) return;
    const flow = flowOf(m.id);
    const at = s => flow.findIndex(f => f._i === s);
    c.steps.forEach((s, i) => {
      const where = `Module ${m.n} · ${m.title}`;
      if (s.t === 'card') SEARCH.push({ kind: 'Card', title: s.title, text: strip(s.body.join(' ') + ' ' + (s.cap || '') + ' ' + (s.hook || '') + ' ' + (s.flag || '')), where, go: () => openModule(m.id, at(i)) });
      if (s.t === 'ix') SEARCH.push({ kind: 'Interactive', title: s.title, text: strip(s.intro || ''), where, go: () => openModule(m.id, at(i)) });
      if (s.t === 'q') SEARCH.push({ kind: 'Question', title: strip(s.q.stem), text: strip((s.q.opts ? 'Answer: ' + s.q.opts[0] + ' · ' : '') + (s.q.why || s.q.model || '')), where, go: () => openModule(m.id, at(i)) });
      if (s.t === 'card' && s.fig) ((FIGS[s.fig] && FIGS[s.fig].labels) || []).forEach(l => { SEARCH.push({ kind: 'Figure label', title: l.en + ' · ' + l.ar, text: l.note || '', where: where + ' · figure', go: () => openModule(m.id, at(i)), key: s.fig + l.id }); });
    });
    (c.flash || []).forEach(f => SEARCH.push({ kind: 'Flashcard', title: strip(f.f), text: strip(f.b), where: `Module ${m.n} · flashcards`, go: () => go('cards') }));
    (c.hooks || []).forEach(h => SEARCH.push({ kind: 'Memory hook', title: h.t, text: h.d, where: `Module ${m.n} · hooks`, go: () => openModule(m.id, flow.findIndex(f => f.t === 'hooks')) }));
  });
  ENTITIES.forEach(e => SEARCH.push({ kind: e.ty === 'Drug' ? 'Drug / treatment' : e.ty, title: e.n + ' · ' + e.ar, text: strip(e.def + ' ' + (e.find || '') + ' ' + (e.care || '')), where: `Entity hub · Module ${modById(e.mid).n}`, go: () => go('hub') }));
  TABLES.filter(t => ready(t.mid)).forEach(t => SEARCH.push({ kind: 'Table', title: t.title, text: strip(t.html), where: `Cheat sheet · Module ${modById(t.mid).n}`, go: () => go('cheat') }));
  NUMBERS.forEach(n => SEARCH.push({ kind: 'Number', title: n.q + ': ' + n.a, text: 'Source ' + n.src, where: `Numbers drill · Module ${modById(n.mid).n}`, go: () => go('numbers') }));
  const seen = new Set();

function allQs(mids, withSA) {
  const out = [];
  MODULES.forEach(m => { if (!ready(m.id) || (mids && !mids.includes(m.id))) return; CONTENT[m.id].steps.forEach(s => { if (s.t === 'q' && (withSA || s.q.type !== 'sa')) out.push({ q: s.q, mid: m.id }); }); });
  return out;
}
function modStats(mid) {
  const qs = allQs([mid], true); let r = 0, t = 0;
  qs.forEach(({ q }) => { const x = S.qs[q.id]; if (x) { t++; if (x.ok) r++; } });
  return { r, t, p: t ? r / t : null };
}

function mixedPool(n) {
  const all = allQs(null, false);
  const score = ({ q, mid }) => {
    const x = S.qs[q.id], st = modStats(mid);
    let w = Math.random();
    if (S.mist[q.id]) w += 3;
    if (!x) w += 1.2;
    if (st.p != null) w += (1 - st.p) * 2;
    return w;
  };
  const picked = all.map(o => ({ o, w: score(o) })).sort((a, b) => b.w - a.w).slice(0, n).map(x => x.o);
  // interleave: avoid two in a row from the same module
  const out = []; const rest = shuffle(picked);
  while (rest.length) { const i = rest.findIndex(x => !out.length || x.mid !== out[out.length - 1].mid); out.push(rest.splice(i < 0 ? 0 : i, 1)[0]); }
  return out;
}
function runExam(m, pool, cfg) {
  if (!pool.length) { m.appendChild(el('<div class="empty"><b>No questions in that selection.</b></div>')); return; }
  const res = [];
  let i = 0, left = cfg.timer * 60, tick = null;
  const head = el(`<div class="prompt" style="margin-bottom:14px"><div class="find"><small>${cfg.mixed ? 'Mixed review' : 'Exam'}</small><span data-n></span></div><span class="timer" data-t></span></div>`);
  const host = el('<div></div>');
  m.append(head, host);
  const start = Date.now();
  if (cfg.timer) {
    tick = setInterval(() => {
      if (!head.isConnected) return clearInterval(tick);
      left--; $('[data-t]', head).textContent = fmt(left);
      if (left <= 0) { clearInterval(tick); toast('Time is up'); finish(); }
    }, 1000);
    $('[data-t]', head).textContent = fmt(left);
  }
  function fmt(s) { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  function show() {
    host.innerHTML = '';
    if (i >= pool.length) return finish();
    $('[data-n]', head).textContent = `Question ${i + 1} of ${pool.length}`;
    const { q, mid } = pool[i];
    host.appendChild(el(`<p class="eyebrow" style="margin-bottom:8px">Module ${modById(mid).n} · ${esc(modById(mid).title)}</p>`));
    renderQ(q, host, {
      quiet: cfg.fb === 'end' && q.type !== 'sa',
      onAnswer: (ok, pick) => {
        res.push({ q, mid, ok, pick });
        const nb = el(`<button class="btn primary" style="margin-top:14px">${i + 1 < pool.length ? 'Next' : 'Finish'} ${I.next}</button>`);
        nb.onclick = () => { i++; show(); window.scrollTo(0, 0); };
        host.appendChild(nb);
        if (cfg.fb === 'end' && q.type !== 'sa') setTimeout(() => nb.isConnected && nb.click(), 350);
      }
    });
  }
  function finish() {
    if (tick) clearInterval(tick);
    host.innerHTML = ''; head.remove();
    const right = res.filter(r => r.ok).length;
    const secs = Math.round((Date.now() - start) / 1000);
    host.appendChild(el(`<div class="done"><span class="tag teach">${cfg.mixed ? 'Mixed review' : 'Exam'} complete</span><div class="big">${pct(right, res.length)}%</div><p class="muted">${right} of ${res.length} correct${res.length < pool.length ? ` · ${pool.length - res.length} unanswered` : ''} · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>`));
    const by = {};
    res.forEach(r => { (by[r.mid] = by[r.mid] || { r: 0, t: 0 }); by[r.mid].t++; if (r.ok) by[r.mid].r++; });
    const rows = Object.entries(by).map(([mid, v]) => ({ mid, ...v, p: v.r / v.t })).sort((a, b) => a.p - b.p);
    const sec = el(`<section class="sect"><header><h2>Weakest first</h2></header><div class="bars"></div></section>`);
    rows.forEach(r => {
      const mod = modById(r.mid), col = r.p >= 0.8 ? 'var(--teal)' : r.p >= 0.5 ? 'var(--amber)' : 'var(--coral)';
      const b = el(`<div class="bar"><span><b>${mod.n}. ${esc(mod.title)}</b></span><span class="mono">${r.r}/${r.t}</span><div class="track"><i style="width:${r.p * 100}%;background:${col}"></i></div><button class="btn small" style="grid-column:1/-1;justify-self:start">Drill module ${mod.n}</button></div>`);
      $('button', b).onclick = () => { m.innerHTML = ''; runExam(m, shuffle(allQs([r.mid], false)).slice(0, 12), { timer: 0, fb: 'instant' }); };
      $('.bars', sec).appendChild(b);
    });
    host.appendChild(sec);
    const wrong = res.filter(r => !r.ok && r.q.type !== 'sa');
    if (wrong.length) {
      const rv = el(`<section class="sect"><header><h2>Review your misses</h2></header><div class="list"></div></section>`);
      wrong.forEach(r => rv.querySelector('.list').appendChild(el(`<div class="set"><p class="eyebrow">Module ${modById(r.mid).n}</p><b style="font-size:15px">${r.q.stem}</b><p style="color:var(--coral);font-size:14px">Your answer: ${r.pick != null ? r.q.opts[r.pick] : '—'}</p><p style="color:var(--teal);font-size:14px">Correct: ${r.q.opts[0]}</p><p style="font-size:14px;color:var(--text2)">${r.q.why}</p>${r.q.trap && r.q.trap[0] > 0 ? `<p style="font-size:13.5px;color:var(--muted)">Tempting wrong answer “${strip(r.q.opts[r.q.trap[0]])}”: ${r.q.trap[1]}</p>` : ''}</div>`)));

    }
    const again = el(`<button class="btn block" style="margin-top:16px">New exam</button>`); again.onclick = () => go('exam', {}, true);
    host.appendChild(again);
  }

}

    <div class="cmpbox"></div></div>`);
  m.appendChild(top);
  const grid = el('<div class="list"></div>'); m.appendChild(grid);
  function card(e, full) {
    return `<span class="ty">${e.ty} · Module ${modById(e.mid).n}</span><b>${esc(e.n)}</b><span class="ar" style="font-size:13px;text-align:left">${esc(e.ar)}</span>
      <dl><dt>What it is</dt><dd>${e.def}</dd>${e.find ? `<dt>${e.ty === 'Condition' ? 'Findings' : 'Details'}</dt><dd>${e.find}</dd>` : ''}${e.care ? `<dt>${e.ty === 'Condition' ? 'Care' : 'Remember'}</dt><dd>${e.care}</dd>` : ''}</dl>${e.src ? `<span class="src">Source: ${esc(e.src)}</span>` : ''}`;
  }
  function draw() {
    grid.innerHTML = '';
    ENTITIES.filter(e => type === 'All' || e.ty === type).forEach(e => {
      const b = el(`<button class="ent ${sel.includes(e.id) ? 'sel' : ''}">${card(e)}</button>`);
      if (e.img) { const f = figureEl(e.img, { labels: false }); f.style.maxWidth = '220px'; b.appendChild(f); }
      b.onclick = () => { sel = sel.includes(e.id) ? sel.filter(x => x !== e.id) : [...sel, e.id].slice(-2); sfx.tap(); draw(); cmp(); };
      grid.appendChild(b);
    });
  }
  function cmp() {
    const box = $('.cmpbox', top); box.innerHTML = '';
    if (sel.length < 2) return;
    const [a, b] = sel.map(id => ENTITIES.find(e => e.id === id));
    const c = el(`<div><p class="eyebrow" style="margin-bottom:8px">Side by side</p><div class="cmp"><div class="ent">${card(a)}</div><div class="ent">${card(b)}</div></div><button class="btn small" style="margin-top:8px" data-clr>Clear</button></div>`);
    $('[data-clr]', c).onclick = () => { sel = []; draw(); cmp(); };
    box.appendChild(c);
  }
  $$('[data-ty]', top).forEach(b => b.onclick = () => { type = b.dataset.ty; $$('[data-ty]', top).forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  $('[data-quiz]', top).onclick = () => { m.innerHTML = ''; whichOne(m); };
  draw();
};
function whichOne(m) {
  let i = 0, right = 0;
  const conds = ENTITIES.filter(e => e.def && e.ty === 'Condition');
  const rounds = shuffle(conds.length >= 10 ? conds : ENTITIES.filter(e => e.def)).slice(0, 10);
  const host = el('<div></div>'); m.appendChild(host);
  function show() {
    host.innerHTML = '';
    if (i >= rounds.length) {
      sfx.win();
      host.appendChild(el(`<div class="done"><span class="tag teach">Which one is it?</span><div class="big">${right}/${rounds.length}</div></div>`));
      const b = el(`<button class="btn block" style="margin-top:12px">Back to the hub</button>`); b.onclick = () => go('hub', {}, true); host.appendChild(b); return;
    }
    const e = rounds[i];
    const same = shuffle(ENTITIES.filter(x => x.ty === e.ty && x.id !== e.id)).slice(0, 3);
    const clue = Math.random() < 0.5 && e.find ? e.find : e.def;
    host.appendChild(el(`<p class="eyebrow">Round ${i + 1} of ${rounds.length} · ${e.ty}</p>`));
    host.appendChild(el(`<div class="alarm-card" style="margin:10px 0"><div class="ah"><span class="dot"></span>Clue</div><p style="font-size:16px">${clue}</p></div>`));
    const opts = el('<div class="opts"></div>'); host.appendChild(opts);
    shuffle([e, ...same]).forEach((o, pos) => {
      const b = el(`<button class="opt"><span class="L">${'ABCD'[pos]}</span><span>${esc(o.n)}</span></button>`);
      b.onclick = () => {
        const ok = o.id === e.id;
        $$('.opt', opts).forEach(x => x.disabled = true);
        b.classList.add(ok ? 'right' : 'wrong');
        if (!ok) $$('.opt', opts).find(x => x.textContent.slice(1) === e.n)?.classList.add('right');
        ok ? (sfx.ok(), right++) : sfx.bad();
        host.appendChild(el(`<div class="callout why" style="margin-top:10px"><span class="h">${esc(e.n)}</span><div>${e.def}${e.care ? ' <b>Care:</b> ' + e.care : ''}</div></div>`));
        const nb = el(`<button class="btn primary small" style="margin-top:10px">Next ${I.next}</button>`); nb.onclick = () => { i++; show(); }; host.appendChild(nb);
      };
      opts.appendChild(b);
    });
  }
  show();
}

/* ---------- visual lab ---------- */
VIEWS.lab = (app, params) => {
  app.appendChild(topBar('Visual lab', 'Figures, photos, ECGs and every interactive', { back: true }));
  const m = mainEl(); app.appendChild(m);
  let tab = params.tab || 'figs';
  const tabs = el(`<div class="filters">${[['figs', 'Figures & photos'], ['ix', 'Interactives'], ['quiz', 'Picture quiz']].map(([k, t]) => `<button data-k="${k}" aria-pressed="${k === tab}">${t}</button>`).join('')}</div>`);
  const body = el('<div></div>');
  m.append(tabs, body);
  $$('button', tabs).forEach(b => b.onclick = () => { tab = b.dataset.k; R.params.tab = tab; $$('button', tabs).forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  function draw() {
    body.innerHTML = '';
    if (tab === 'figs') {
      const g = el('<div class="gallery"></div>');
      Object.keys(IMG).forEach(k => {
        const b = el(`<button><div class="th"><img src="${IMG[k]}" alt="" loading="lazy"></div><b>${esc(IMG_TITLES[k] || k)}</b><span class="src" style="padding:0 4px 4px">Module ${modById(IMG_MOD[k] || 'm1').n}</span></button>`);
        b.onclick = () => openLightbox(k, { title: IMG_TITLES[k] || k });
        g.appendChild(b);
      });
      body.appendChild(g);
    }
    if (tab === 'ix') {
      const g = el('<div class="gallery"></div>');
      MODULES.forEach(x => { const c = CONTENT[x.id]; if (!c) return; const flow = flowOf(x.id);
        c.steps.forEach((s, i) => { if (s.t !== 'ix') return;
          const ic = s.kind.includes('3d') ? I.hub : s.kind === 'ecg' ? I.drill : s.kind === 'triage' ? I.mistake : I.spark;
          const thumb = s.spec && s.spec.fig && IMG[s.spec.fig] ? `<div class="th"><img src="${IMG[s.spec.fig]}" alt="" loading="lazy"></div>` : s.spec && s.spec.a ? `<div class="th"><img src="${IMG[s.spec.a.img]}" alt="" loading="lazy"></div>` : `<div class="th ix">${ic}</div>`;
          const b = el(`<button>${thumb}<b>${esc(s.title)}</b><span class="src" style="padding:0 4px 4px">${esc(IX_NAMES[s.kind] || s.kind)} · M${x.n}</span></button>`);
          b.onclick = () => openModule(x.id, flow.findIndex(f => f._i === i));
          g.appendChild(b);
        }); });
      body.appendChild(g);
    }
    if (tab === 'quiz') picQuiz(body);
  }
  draw();
};
function picQuiz(host) {
  const rounds = shuffle(PICQ).slice(0, 10);
  let i = 0, right = 0;
  function show() {
    host.innerHTML = '';
    if (i >= rounds.length) {
      sfx.win();
      host.appendChild(el(`<div class="done"><span class="tag teach">Picture quiz</span><div class="big">${right}/${rounds.length}</div></div>`));
      const b = el(`<button class="btn block" style="margin-top:12px">Play again</button>`); b.onclick = () => { i = 0; right = 0; rounds.sort(() => Math.random() - .5); show(); }; host.appendChild(b); return;
    }
    const r = rounds[i];
    host.appendChild(el(`<p class="eyebrow" style="margin-bottom:8px">Picture ${i + 1} of ${rounds.length} · What is this?</p>`));
    const f = figureEl(r.img, { labels: false }); f.style.maxWidth = '520px'; f.style.marginInline = 'auto'; f.onclick = () => openLightbox(r.img, { title: 'What is this?', labels: false });
    host.appendChild(f);
    const opts = el('<div class="opts" style="margin-top:12px"></div>'); host.appendChild(opts);
    shuffle([r.a, ...r.d]).forEach((t, pos) => {
      const b = el(`<button class="opt"><span class="L">${'ABCD'[pos]}</span><span>${esc(t)}</span></button>`);
      b.onclick = () => {
        const ok = t === r.a;
        $$('.opt', opts).forEach(x => { x.disabled = true; if (x.textContent.slice(1) === r.a) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        ok ? (sfx.ok(), right++) : sfx.bad();
        const nb = el(`<button class="btn primary small" style="margin-top:10px">Next ${I.next}</button>`); nb.onclick = () => { i++; show(); }; host.appendChild(nb);
      };
      opts.appendChild(b);
    });
  }
  show();
}
