      hook: 'Anemia transport triggers “<b>MHO</b>”: <b>M</b>ental status change, <b>H</b>ypotension, <b>O</b>ther significant changes.' },
    { t: 'q', q: { id: 'm5q7', lv: 'U', src: 'A38n, B48', stem: 'Anginal-type chest pain in anemia is related to:',

      opts: ['Cutaneous bleeding (petechiae) and bleeding from mucous membranes', 'Thrombosis', 'Jaundice', 'High blood pressure'],

      trap: [1, 'Too MANY platelets (thrombocytosis) causes thrombosis.'] } },
    { t: 'q', q: { id: 'm5q9', lv: 'A', src: 'A39, A39n, B50', stem: 'An anemic patient develops chest pain en route. What should you do according to the notes?',
      opts: ['Apply a cardiac monitor; a 12-lead ECG may also be needed', 'Perform phlebotomy', 'Cover with a blanket and give no oxygen', 'Stop all fluids'],
      why: 'Anemia management: in cases of chest pain, apply a cardiac monitor; a 12-lead ECG may also be needed.',
      trap: [1, 'Phlebotomy treats polycythemia.'] } },
    { t: 'q', q: { id: 'm5q10', lv: 'R', src: 'A39, B51', stem: 'Consider rapid transport of an anemia patient for all of the following <b>EXCEPT</b>:',
      opts: ['Feeling worn down', 'Abrupt change in mental status', 'Hypotension', 'Other significant changes'],

    { t: 'card', id: 'm5c6', title: 'Polycythemia: too many red cells', src: 'A51 · A51n · B66',
      predict: { q: 'Polycythemia makes the blood thicker. What risk does hyperviscosity raise?', a: 'Thrombus formation.' },
      body: ['<k>Polycythemia</k> is an <k>overabundance or overproduction of RBCs</k>, resulting in <k>increased blood viscosity and volume</k>. This can cause <k>congestion of tissues and organs</k>; <k>hyperviscosity</k> of the blood <k>increases the risk of thrombus formation</k>.',
        'It can be caused by: a <k>rare disorder originating in a single stem cell</k>; an <k>existing disease such as heart failure or hypotension</k>; or <k>living in high-altitude areas for long periods</k>.'],
      flag: 'Standard references give chronic hypoxia (for example lung or heart disease) as the cause of secondary polycythemia; “hypotension” is unusual. Keep your notes’ wording: “heart failure or hypotension”.' },
    { t: 'card', id: 'm5c7', title: 'Complications and treatment', src: 'A52 · A52n · B67',
      body: ['Polycythemia may lead to: <k>strokes</k>, <k>transient ischemic attacks</k>, <k>deep vein thrombosis</k> (notes), <k>pulmonary embolism</k>, <k>myocardial infarction</k>, <k>headaches</k>, and <k>abdominal pain</k> (usually associated with an <k>enlarged spleen</k>).',
        'Clinical treatment usually includes <k>phlebotomy</k> to maintain hematocrit levels: <n>less than 45%</n> in men and <n>less than 42%</n> in women. Other treatments include <k>cancer-type therapy</k>.'],
      hook: 'Phlebotomy targets: men under <b>45</b>, women under <b>42</b>.' },
    { t: 'ix', id: 'm5x1', kind: 'visc', title: 'Hematocrit flow model', intro: 'Drag the hematocrit and watch the vessel fill and slow. Complete the three tasks: an anemia value, a polycythemia value, then phlebotomy back to target.', spec: {} },
    { t: 'card', id: 'm5c8', title: 'Polycythemia: assessment and care', src: 'A53–A54 · notes · B68–70',
      body: ['Findings may vary widely: <k>altered levels of consciousness</k>, <k>hypoxia</k>, <k>respiratory distress</k>, <k>changes in peripheral pulses, pulse rate, and skin color</k>, and <k>tachycardia</k>. Note the <k>extent and duration of dyspnea</k>. Ask about <k>uncontrolled itching (pruritus)</k> and <k>changes in skin temperature</k>. Obtain a thorough medical history.',
        'Management: <k>initially focus on the chief complaint</k>; although the underlying pathology may be polycythemia, the patient may be experiencing a <k>different medical emergency</k>. Otherwise provide <k>supportive care and transport</k> to an appropriate facility, <k>oxygen as needed</k>, and <k>IV access</k> for possible pharmacologic interventions.'] },

    { t: 'ix', id: 'm5x3', kind: 'triage', title: 'Case: two patients, two problems', intro: 'Decide at each step.',
      spec: { kind: 'Step', title: 'Two calls in one shift', cases: [
        { head: 'Call 1 · 34-year-old woman', text: 'Heavy periods for months. Tired, “can’t catch my breath” climbing stairs, pale. Now chest tightness.', vitals: { HR: '112', BP: '108/66', SpO2: '96%' }, q: 'Most likely underlying problem?', opts: ['Iron-deficiency anemia from menstrual bleeding', 'Polycythemia', 'Hemophilia A', 'Acute chest syndrome'], why: 'Menstrual bleeding is a typical cause of iron-deficiency anemia, the most common type. Fatigue, breathlessness and anginal-type chest pain fit.' },
        { head: 'Call 1 · care', text: 'Chest tightness persists.', q: 'What does your anemia management add for chest pain?', opts: ['Cardiac monitor, and a 12-lead ECG may be needed', 'Phlebotomy', 'Withhold oxygen', 'Apply cold packs'], why: 'In cases of chest pain, apply a cardiac monitor; a 12-lead ECG may also be needed. Also position of comfort, airway/breathing, frequent VS, BP and fluids.' },
        { head: 'Call 1 · en route', alarm: true, text: 'She becomes confused and her BP drops to 82/50.', q: 'Your next decision?', opts: ['Rapid transport: abrupt mental status change and hypotension', 'Continue routine transport', 'Stop and recheck her blood type', 'Release her at home'], why: 'Consider rapid transport for abrupt change in mental status, hypotension, or other significant changes.' },
        { head: 'Call 2 · 66-year-old man', text: 'Known polycythemia. Headache, itchy skin after a hot shower, and a ruddy face. Today: sudden weakness of the right arm.', q: 'What complication of polycythemia should you suspect?', opts: ['Stroke or transient ischemic attack', 'Splenic sequestration', 'Hemolytic crisis', 'Transfusion-related lung injury'], why: 'Polycythemia may lead to strokes, TIAs, DVT, PE, MI, headaches and abdominal pain; hyperviscosity raises thrombus risk.' },
        { head: 'Call 2 · care', text: 'He also has a mildly enlarged spleen on his records.', q: 'Your management focus?', opts: ['Focus first on the chief complaint (possible stroke): supportive care, O₂ as needed, IV access, transport', 'Perform phlebotomy on scene', 'Treat only the polycythemia', 'Cover with a blanket to prevent sickling'], why: 'Initially focus on the chief complaint: the patient may be having a different emergency. Then supportive care, oxygen as needed, IV access, transport.' },

  arabic: `
<div class="blk"><h3>فقر الدم <span class="en">Anemia</span></h3><ul>
<li>هيموغلوبين أو كريات أقل من الطبيعي؛ مرتبط بمرض كامن، فقد دم حاد أو مزمن، نقص إنتاج أو زيادة تكسير، أو اضطراب انحلالي</li>
<li>الأشيع: نقص الحديد (نزف هضمي، الدورة الشهرية، التبرع/الفحوص المتكررة، الخداج ونقص وزن الولادة)</li>
<li>أسباب أخرى: <span class="en">sickle cell, thalassemia</span>، نقص <span class="en">G6PD</span> (الأشيع عند الأمريكيين الأفارقة)، أمراض مناعية، ميكروبات</li>
<li>في المرتفعات: نقص أكسجة، صعوبة تنفس، ألم صدر</li>
<li>الأعراض: تعب، لا طاقة، ضيق نفس، ألم صدري ذبحي، تغير لون الجلد، <span class="en">leukopenia, thrombocytopenia</span> (نمشات، رعاف، نزف شرجي)</li>
<li>العلاج: وضعية مريحة، مراقبة التنفس والعلامات، مونيتور و12-lead عند ألم الصدر، الضغط والسوائل؛ نقل سريع عند تغير الوعي أو هبوط الضغط</li></ul></div>
<div class="blk"><h3>كثرة الحمر <span class="en">Polycythemia</span></h3><ul>
<li>زيادة الكريات الحمراء ← لزوجة وحجم أكبر ← خطر الجلطات</li>
<li>الأسباب: اضطراب نادر من خلية جذعية واحدة، مرض قائم (فشل قلب أو هبوط ضغط ⚑)، العيش طويلاً في المرتفعات</li>
<li>المضاعفات: سكتة، نوبات نقص تروية عابرة، <span class="en">DVT</span>، انصمام رئوي، احتشاء، صداع، ألم بطن (طحال متضخم)</li>
<li>العلاج: سحب الدم <span class="en">phlebotomy</span> لإبقاء الهيماتوكريت أقل من ٤٥٪ للرجال و٤٢٪ للنساء، وعلاج شبيه بعلاج السرطان</li>
<li>الميدان: ركّز على الشكوى الرئيسية أولاً، دعم، أكسجين، خط وريدي، نقل؛ واسأل عن الحكة وحرارة الجلد</li></ul></div>`,
};

/* ===== Module 6 · Blood Cancers ===== */
CONTENT.m6 = {
  intro: 'Three cancers of the blood-forming system, easy to mix up. Leukemia floods the blood with abnormal white cells. Lymphomas grow in the lymphoid glands (Hodgkin or non-Hodgkin). Multiple myeloma fills the bone marrow with plasma cells and eats the bone. In the field you will often meet them as complications of the disease or its treatment, and sometimes as a family that does not know what to do.',
  steps: [
    /* --- Leukemia --- */
    { t: 'card', id: 'm6c1', title: 'Leukemia: too many abnormal cells', src: 'A40 · A40n · B52', fig: 'leuk_child',
      cap: 'A child receiving treatment, with a dressing on the neck. Chemotherapy and radiation usually bring remission.',
      body: ['<k>Leukemia</k> is <k>cancer (that develops) in the lymphoid system</k>, with <k>increased production of immature and/or abnormal blood cells</k> (particularly WBCs). It can cause <k>anemia</k>, <k>thrombocytopenia</k> and <k>leukocytosis</k>.',
        '<k>Chemotherapy</k> typically leads to <k>leukopenia</k> (decreased WBCs). Patients with leukemia experience <k>frequent bleeding, bruising, infections, and fever</k>.'],
      flag: 'Standard references describe leukemia as a cancer of the blood-forming tissues and bone marrow (myeloid or lymphoid). Your notes say “cancer in the lymphoid system”; use the notes’ wording.' },
    { t: 'card', id: 'm6c2', title: 'Acute vs chronic leukemia', src: 'A41 · A41n · B53',
      predict: { q: 'Which form of leukemia is usually found by chance on routine blood tests, and in which age group is it more frequent?', a: 'Chronic leukemia; people 65 years or older.' },
      body: ['In <k>acute leukemia</k>, the <k>bone marrow is replaced with abnormal lymphoblasts</k>.',
        '<k>Chronic leukemia</k> develops more frequently in people <n>65 years or older</n>. Abnormal mature lymphoid cells accumulate in the <k>bone marrow, lymph nodes, spleen, and peripheral blood</k>. It is typically <k>found by chance during routine blood tests</k>.'],
      flag: 'Standard references say acute leukemia replaces marrow with blasts that can be myeloid or lymphoid. The notes say “abnormal lymphoblasts”; use the notes’ wording.' },
    { t: 'card', id: 'm6c3', title: 'Survival, treatment, remission', src: 'A42 · A42n · B54',
      body: ['Survival depends on: <k>the stage at which the disease is detected</k>, the patient’s <k>underlying medical condition</k>, and the <k>response to treatment</k>.',
        'Leukemia is treated with <k>chemotherapy and radiation (therapy)</k>; in most cases treatment results in <k>remission</k>. Children with <k>acute lymphoblastic leukemia</k> have a <k>5-year survival rate of more than 90%</k>.'] },
    { t: 'card', id: 'm6c4', title: 'Leukemia: assessment', src: 'A43 · A43n · B55–56',
      body: ['Use appropriate standard precautions, <k>including gloves and mask</k>: <k>the patient could be immunocompromised</k>. Presentation depends on the <k>stage of leukemia</k> and the <k>current treatment</k>.',
        'Patients may present with: <k>fatigue</k>, <k>headaches</k>, <k>dyspnea</k>, <k>signs of neurologic defects</k>, <k>fever</k>, <k>bone pain</k>, <k>diaphoresis</k>, <k>feeling full</k>, <k>soreness in the midpart of the chest</k>, and <k>unexplained bleeding</k>. Assess all vital signs and the cardiac rhythm: <k>hypotension and tachycardia</k> are often present.'],
      flag: 'The slide shows four of these ten (fatigue, headaches, bone pain, unexplained bleeding); the other six come from the speaker notes. All ten are kept.' },
    { t: 'card', id: 'm6c5', title: 'Leukemia: management, and the difficult call', src: 'A44 · A44n · B57–58',
      body: ['As appropriate, provide <k>airway support</k>, <k>oxygen therapy</k>, <k>IV fluid therapy</k>, <k>analgesics</k>, and <k>emotional support</k>.',
        'You may be called because the patient’s condition has deteriorated and <k>loved ones are uncertain about what to do</k>: <k>discuss the situation with medical control</k>, <k>document all findings (before leaving)</k>, and <k>have a refusal and/or release form signed</k> if transport is declined. If you transport, be aware <k>the patient could go into arrest</k>; make sure you understand the <k>patient’s and family’s wishes</k> about what to do.'],
      flag: 'The last sentence (possible arrest; understand the patient’s and family’s wishes) appears only in file B’s notes. It is kept because both files are examinable.' },
    { t: 'q', q: { id: 'm6q1', lv: 'R', src: 'A40, B52', stem: 'Leukemia can cause all of the following <b>EXCEPT</b>:',
      opts: ['Polycythemia', 'Anemia', 'Thrombocytopenia', 'Leukocytosis'],
      why: 'Leukemia can cause anemia, thrombocytopenia and leukocytosis.',
      trap: [3, 'Leukocytosis (too many WBCs) IS caused by leukemia.'], flag: 'Notes define leukemia as “cancer in the lymphoid system”.' } },
    { t: 'q', q: { id: 'm6q2', lv: 'U', src: 'A40, B52', stem: 'A leukemia patient on chemotherapy is likely to have:',
      opts: ['Leukopenia (decreased WBCs)', 'Leukocytosis', 'Polycythemia', 'Thrombocytosis'],

    { t: 'q', q: { id: 'm6q8', lv: 'A', src: 'A44, B58', stem: 'A leukemia patient has deteriorated at home; the family called because they are unsure what to do, and the patient declines transport. Your notes say to:',

    { t: 'q', q: { id: 'm6q9', lv: 'R', src: 'A43n, B55–56', stem: 'Which is <b>NOT</b> on the notes’ list of leukemia presentations?',

    /* --- Lymphomas --- */
    { t: 'card', id: 'm6c6', title: 'Lymphomas: two categories', src: 'A45–A46 · notes · B59–60',
      body: ['<k>Lymphomas</k> are a <k>group of malignant diseases (that arise) within the lymphoid system</k>, classified in two categories: <k>non-Hodgkin</k> and <k>Hodgkin</k>.',
        '<k>Non-Hodgkin lymphoma</k> can occur at <k>any age</k> and <k>can be hereditary</k>. It is characterized by progression: <k>indolent (very slow)</k>, which <k>may never leave the lymphoid system</k>; <k>aggressive (fast-growing)</k>; and <k>highly aggressive (very fast-growing)</k>, which <k>may affect multiple organs in a short period</k>.'],
      hook: 'Non-Hodgkin speeds: <b>I</b>ndolent → <b>A</b>ggressive → <b>H</b>ighly aggressive (“I Am Hurrying”).' },
    { t: 'card', id: 'm6c7', title: 'Hodgkin lymphoma', src: 'A47–A48 · notes · B61–62',
      predict: { q: 'Hodgkin lymphoma has two incidence peaks. When?', a: 'At 10 and 35 years of age, and in late life.' },
      body: ['<k>Hodgkin lymphoma</k>: <k>painless, progressive enlargement of the lymphoid glands</k>; most commonly affects the <k>spleen and lymph nodes</k>; a <k>rare</k> form; suspected to have some <k>hereditary components</k>; incidence peaks at <n>10 and 35 years</n> and in <k>late life</k>.',
        'There may be <k>no symptoms for years</k>, but symptoms include <k>night sweats</k>, <k>chills</k>, <k>persistent cough</k>, <k>swelling of (various) lymph nodes</k>, <k>loss of appetite</k>, <k>(significant) weight loss</k>, <k>(generalized) itching</k>, <k>fatigue</k>, and <k>bone pain</k>. With treatment, symptoms may disappear for long periods, and cure is possible.'] },
    { t: 'card', id: 'm6c8', title: 'Lymphomas: assessment and management', src: 'A49–A50 · notes · B63–65', fig: 'ems_care',
      cap: 'Two practitioners treating a patient on a stretcher: in lymphoma, treat perfusion and rhythm, and manage pain aggressively.',
      body: ['Lymphomas require (specialized levels of) <k>chemotherapy or radiation</k>; response depends on the <k>stage and classification</k>. Ask: “<k>Which type of cancer do you have?</k>” and “<k>Which type of treatment are you receiving?</k>” Signs: <k>pallor</k>, <k>congestion in lower lung fields</k>, <k>feeling hot and then cold or both</k> (in different areas of the body), <k>inadequate perfusion</k>, <k>low blood pressure</k>, <k>abnormal ECG rhythms</k>.',
        'Management: <k>manage pain aggressively with a high-dose analgesic regimen</k>; treat inadequate perfusion (<k>fluid therapy, supplemental oxygen</k>); treat abnormal heart rhythms; <k>initiate rapid transport if the condition does not improve</k> or deteriorates. If called to support but not transport: <k>be supportive</k>, <k>discuss findings with medical control</k>, <k>explain options to the patient and family, and allow them to decide</k>.'] },
    { t: 'q', q: { id: 'm6q10', lv: 'R', src: 'A47, B61', stem: 'Hodgkin lymphoma is characterized by:',
      opts: ['Painless, progressive enlargement of the lymphoid glands', 'Painful enlargement of the spleen in toddlers', 'Plasma cell tumors in bone', 'Bone marrow replaced by lymphoblasts'],
      why: 'Hodgkin: painless, progressive enlargement of the lymphoid glands; most commonly spleen and lymph nodes.',
      trap: [1, 'That is splenic sequestration in sickle cell disease.'] } },
    { t: 'q', q: { id: 'm6q11', lv: 'R', src: 'A47, B61', stem: 'The peak ages of Hodgkin lymphoma are:',
      opts: ['10 and 35 years, and late in life', '65 years or older only', 'Any age equally', 'Older than 40 only'],
      why: 'Incidence at two peaks: 10 and 35 years of age and in late life.',
      trap: [2, 'Any age describes NON-Hodgkin lymphoma.'] } },
    { t: 'q', q: { id: 'm6q12', lv: 'R', src: 'A46, B60', stem: 'A highly aggressive non-Hodgkin lymphoma:',
      opts: ['May affect multiple organs in a short period', 'May never leave the lymphoid system', 'Is always painless and rare', 'Peaks at 10 and 35 years'],

    { t: 'q', q: { id: 'm6q13', lv: 'R', src: 'A48, B62', stem: 'Which is <b>NOT</b> a listed symptom of Hodgkin lymphoma?',
      opts: ['Pain in the hands and feet', 'Night sweats', 'Generalized itching', 'Persistent cough'],

    { t: 'q', q: { id: 'm6q14', lv: 'U', src: 'A50, B65', stem: 'How should pain be managed in a lymphoma patient, according to the notes?',

    { t: 'q', q: { id: 'm6q15', lv: 'R', src: 'A49, B63–64', stem: 'Which finding is listed in lymphoma assessment?',

    { t: 'q', q: { id: 'm6q16', lv: 'A', src: 'A50n, B65', stem: 'You are called to support a lymphoma patient who does not want transport. The notes say to:',
      opts: ['Be supportive, discuss findings with medical control, explain options and let the patient and family decide', 'Insist on transport', 'Leave immediately', 'Start a phlebotomy'],

    { t: 'card', id: 'm6c9', title: 'Multiple myeloma', src: 'A62–A63 · notes · B79–80',
      predict: { q: 'Which cells multiply abnormally in multiple myeloma?', a: 'Plasma cells in the bone marrow, forming tumors in the bone.' },
      body: ['In <k>multiple myeloma</k>, the number of <k>plasma cells in the bone marrow increases abnormally, forming tumors in the bone</k>. This <k>impairs normal bone marrow function</k>, decreases <k>RBC, WBC, and platelet formation (function)</k>, and results in <k>anemia and susceptibility to infection</k>.',
        'Neoplastic cells may <k>accelerate protein development in the bloodstream</k>, leading to <k>organ failure</k>. It occurs mostly in patients <n>older than 40</n>. As it progresses, <k>weakness in the bones</k> causes <k>spontaneous fractures</k> and <k>pain in the bones and back</k>. In advanced cases, <k>stem cell transplant, chemotherapy, and radiotherapy</k> may be given.'] },
    { t: 'card', id: 'm6c10', title: 'Multiple myeloma: assessment and care', src: 'A64–A65 · notes · B81–82',

/* ===== Module 7 · Bleeding Disorders ===== */
CONTENT.m7 = {
  intro: 'Two ways clotting fails. In hemophilia one factor is missing from birth, so a clot never forms properly. In DIC the body clots everywhere at once, uses up its clotting factors, and then bleeds uncontrollably. Both connect directly to the cascade you ran in Module 2.',
  steps: [
    { t: 'card', id: 'm7c1', title: 'Hemophilia: a missing factor', src: 'A58 · A58n · B75',
      predict: { q: 'Hemophilia A and B each lack one clotting factor. Which ones?', a: 'A: factor VIII. B: factor IX.' },
      body: ['<k>Hemophilia</k> is a <k>bleeding disorder in which clotting does not occur or occurs insufficiently</k>. It is usually associated with an <k>X-linked recessive inheritance pattern</k> and is <k>primarily found in males</k>.',

<div class="blk"><h3>الهيموفيليا <span class="en">Hemophilia</span></h3><ul>
<li>اضطراب نزف: التخثر لا يحدث أو لا يكفي؛ وراثة متنحية مرتبطة بـ<span class="en">X</span>؛ غالباً عند الذكور</li>
<li><span class="en">Type A</span>: نقص <span class="en">factor VIII</span> · <span class="en">Type B</span>: نقص <span class="en">factor IX (Christmas factor)</span>؛ والشدة حسب مستوى العاملين</li>
<li>الأعراض واحدة في النوعين: نزف حاد ومزمن، ونزف داخل الجمجمة تلقائي؛ وقد يحتاج نقل دم وتسريب العوامل</li>
<li>التقييم: <span class="en">ABCs</span>، فقد دم حاد، نزف مجهول المصدر، نقص أكسجة</li>
<li>العلاج: أكسجين، تخطيط قلب، وريدي، مسكنات، تدفئة؛ وإذا توقف النزف قبل وصولك اطلب منه متابعة فورية</li></ul></div>
<div class="blk"><h3>التخثر المنتشر داخل الأوعية <span class="en">DIC</span></h3><ul>
<li>تسببه حالات مهددة للحياة، ويمر بمرحلتين</li>
<li>المرحلة ١: زيادة <span class="en">thrombin</span> وترسبات <span class="en">fibrin</span>، تجمع الصفائح، و<span class="en">defibrination</span> (تكسير الجلطات)</li>

<li>الوفاة من النزف وهبوط الضغط والصدمة؛ نسبة الوفيات صعبة التحديد</li>

<li>العلاج: مجرى هواء، أكسجين، علاج الصدمة، تسكين، علاج اضطراب النظم، وكن متفائلاً لكن صادقاً</li></ul></div>`,

  intro: 'Paramedics often transport patients who are receiving blood, between facilities or at home. A transfusion reaction behaves like anaphylaxis: fast, and capable of circulatory collapse. You need three things: which blood is safe (Table 25-4), what the six complications look like, and the exact order of what to do.',

    { t: 'card', id: 'm8c1', title: 'What a transfusion reaction is', src: 'A66 · A66n · B83–84',
      predict: { q: 'For how long after starting a transfusion should you watch the patient very closely?', a: 'The first 30 to 60 minutes.' },
      body: ['Transfusion reactions occur in approximately <n>0.2% to 10%</n> of blood transfusions. A reaction <k>occurs when a patient receives a blood type different than their own</k>.',
        'It is <k>similar to an anaphylactic reaction</k>: it <k>occurs rapidly</k> and can cause <k>(severe) circulatory collapse</k> or death. <k>Monitor a patient receiving a blood transfusion very closely for the first 30 to 60 minutes</k>, and determine the patient’s blood type and the type of blood received.'] },

      predict: { q: 'Which transfusion complication is the greatest threat, and which is the most common?', a: 'Hemolytic reaction is the greatest threat; febrile reaction is the most common.' },
      body: ['<k>Hemolytic reaction</k>: the <k>greatest threat</k> during a transfusion; primarily caused by <k>incompatibility</k> between recipient and donor blood; the recipient’s immune system is activated by donor blood, <k>destroying new RBCs</k>. <k>Febrile reaction</k>: the <k>most common</k> complication; usually <k>benign</k>; treated with an <k>antipyretic and observation</k>. <k>Allergic reaction</k>: anaphylactic reaction to <k>preservatives or other agents</k> in the product; usually within the <k>first few minutes</k>; classic anaphylactic signs.',
        '<k>Transfusion-related lung injury</k>: a <k>noncardiogenic pulmonary edema</k> caused by increased capillary permeability after transfusion; treatment supports the <k>ABCs</k>. <k>Circulatory overload</k>: typically in patients with preexisting <k>cardiomyopathy or ventricular dysfunction</k>; treated by relieving excess fluid through <k>diuresis</k> and using <k>oxygen, nitrates, and morphine</k>. <k>Bacterial infection</k>: typically from <k>poor blood product handling or contamination</k> during infusion; can lead to full systemic <k>sepsis</k>.'],

  arabic: `
<div class="blk"><h3>تفاعلات نقل الدم</h3><ul>
<li>تحدث في ٠٫٢–١٠٪ من عمليات النقل، عند إعطاء فصيلة مختلفة</li>
<li>تشبه الحساسية المفرطة: سريعة، وقد تسبب انهياراً دورانياً أو وفاة؛ راقب بدقة أول ٣٠–٦٠ دقيقة</li>
<li>العلامات: قشعريرة، حمى، ألم ظهر، قيء، تسرع قلب، هبوط ضغط؛ خفية عند المريض الفاقد للوعي أو المنبوب؛ وقد تتأخر حتى ٧ أيام</li></ul></div>
<div class="blk"><h3>جدول 25-4 (الفصائل)</h3><ul>
<li>كل مريض يفضَّل له نفس فصيلته؛ <span class="en">O−</span> لا يأخذ إلا <span class="en">O−</span>؛ <span class="en">AB+</span> يأخذ كل الفصائل</li>
<li>المريض سالب العامل <span class="en">Rh</span> يأخذ دماً سالباً فقط</li></ul></div>
<div class="blk"><h3>المضاعفات الست</h3><ul>
<li><span class="en">Hemolytic</span>: الأخطر؛ عدم توافق ← المناعة تدمر الكريات الجديدة</li>
<li><span class="en">Febrile</span>: الأشيع، حميد غالباً؛ خافض حرارة ومراقبة</li>
<li><span class="en">Allergic</span>: تحسس من المواد الحافظة، في الدقائق الأولى</li>
<li><span class="en">TRALI</span>: وذمة رئوية غير قلبية؛ دعم <span class="en">ABCs</span></li>
<li><span class="en">Circulatory overload</span>: عند اعتلال القلب؛ مدرات، أكسجين، نترات، مورفين</li>
<li><span class="en">Bacterial infection</span>: سوء تداول أو تلوث ← إنتان</li></ul></div>
<div class="blk"><h3>العلاج بالترتيب</h3><p>أوقف النقل فوراً ← أعد فحص بيانات الدم المتبرع به ← تواصل مع الطبيب ← رعاية داعمة ضد الصدمة ← استبدل الأنبوب والكيس بمحلول ملحي ← احتفظ بالدم والأنابيب وسلّمها للمستشفى. الشدة تتناسب مع كمية الدم المنقولة.</p></div>`,
};

const APP_KEY = 'heme25.v1';
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOST_THEME = document.documentElement.getAttribute('data-theme');

function defaults() {
  return { v: 1, prog: {}, qs: {}, srs: {}, mist: {}, rec: {}, started: {}, last: null,
    set: { qmode: 'inline', theme: 'auto', sound: true, arLabels: false } };
}
function loadState() {
  try {
    const raw = localStorage.getItem(APP_KEY);
    if (raw) {
      const d = JSON.parse(raw), base = defaults();
      return Object.assign(base, d, { set: Object.assign(base.set, d.set || {}) });
    }
  } catch (e) {}
  return defaults();
}
const S = loadState();
let _saveT;
function save() {
  clearTimeout(_saveT);
  _saveT = setTimeout(() => { try { localStorage.setItem(APP_KEY, JSON.stringify(S)); } catch (e) {} }, 120);
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function strip(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g, ' ').trim(); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }

function applyTheme() {
  const r = document.documentElement, t = S.set.theme;
  if (t === 'auto') { if (HOST_THEME) r.setAttribute('data-theme', HOST_THEME); else r.removeAttribute('data-theme'); }
  else r.setAttribute('data-theme', t);

/* ---- sound: short monitor-style tones, quiet by design ---- */
let _ac = null;
function tone(freqs, dur = 0.09, type = 'sine', gain = 0.05) {
  if (!S.set.sound) return;
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    let t = _ac.currentTime;
    freqs.forEach(f => {
      const o = _ac.createOscillator(), g = _ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(_ac.destination); o.start(t); o.stop(t + dur + 0.02);
      t += dur * 0.9;
    });
  } catch (e) {}
}
const sfx = {
  ok: () => tone([880, 1320], 0.09, 'sine', 0.045),
  bad: () => tone([196, 147], 0.12, 'triangle', 0.05),
  win: () => tone([660, 880, 1320], 0.1, 'sine', 0.04),
  tap: () => tone([1200], 0.03, 'sine', 0.02),
};

/* figure element: image + optional label chips (study mode) */
function figureEl(key, opts = {}) {
  const f = FIGS[key];
  const wrap = el(`<div class="fig"><img alt="${esc(opts.alt || (f && f.alt) || key)}" src="${IMG[key]}" loading="lazy" decoding="async"></div>`);
  if (f && opts.labels !== false) {
    const only = opts.only ? new Set(opts.only) : null;
    let n = 0;
    (f.labels || []).forEach(l => {
      if (l.hide || (only && !only.has(l.id)) || (!only && l.path && !opts.withPath)) return;
      if (f.dense) { const [x, y] = pinCenter(l); wrap.appendChild(el(`<span class="pin num" style="left:${x}%;top:${y}%">${++n}</span>`)); return; }
      wrap.appendChild(pinEl(l, S.set.arLabels));
    });
  }
  return wrap;
}
/* legend for dense figures (numbered dots) */
function legendEl(key, only) {
  const f = FIGS[key]; if (!f || !f.dense) return null;
  const set = only ? new Set(only) : null;
  const ls = (f.labels || []).filter(l => !l.hide && (!set || set.has(l.id)));
  return el(`<ol class="legend fixed">${ls.map((l, i) => `<li><b>${i + 1}</b>${esc(S.set.arLabels ? l.ar : l.en)}</li>`).join('')}</ol>`);
}
function pinCenter(l) { return [(l.box[0] + l.box[2]) / 2, (l.box[1] + l.box[3]) / 2]; }
function pinEl(l, ar) {
  const [x, y] = pinCenter(l);
  const a = l.box[0] < 12 ? 'l' : l.box[2] > 88 ? 'r' : 'c';
  const pos = a === 'l' ? `left:${l.box[0]}%;transform:translate(0,-50%)` : a === 'r' ? `left:${l.box[2]}%;transform:translate(-100%,-50%)` : `left:${x}%`;
  return el(`<span class="pin${ar ? ' ar' : ''}" style="${pos};top:${y}%" title="${esc(l.note || '')}">${esc(ar ? l.ar : (l.short || l.en))}</span>`);
}

/* Tap-to-label: find each structure on the figure */
IX.label = function (spec, host, done) {
  const f = FIGS[spec.fig];
  const targets = (f.labels || []).filter(l => !l.hide && (spec.only ? spec.only.includes(l.id) : !l.path));
  let order, k, errors, found;
  const root = el(`<div class="ix">
    <div class="prompt"><div class="find"><small>Find on the figure</small><span></span><div class="ar muted" style="font-size:13px;text-align:left;direction:rtl"></div></div>
      <span class="score"></span><button class="btn small ghost" data-hint>Show me</button></div>
    <div class="figslot"></div><ol class="legend" aria-label="Found so far"></ol><div class="after"></div></div>`);
  host.appendChild(root);
  const fig = figureEl(spec.fig, { labels: false });
  $('.figslot', root).appendChild(zoomable(fig));
  const dots = {};
  targets.forEach(l => {
    const [x, y] = pinCenter(l);
    const d = el(`<span class="pin dot" data-id="${l.id}" style="left:${x}%;top:${y}%" aria-hidden="true"></span>`);
    fig.appendChild(d); dots[l.id] = d;
  });
  function start() {
    order = shuffle(targets); k = 0; errors = 0; found = new Set();
    targets.forEach(l => { const d = dots[l.id]; d.className = 'pin dot'; d.textContent = ''; const [x] = pinCenter(l); d.style.left = x + '%'; d.style.transform = ''; });
    $('.after', root).innerHTML = ''; $('.legend', root).innerHTML = ''; $('[data-hint]', root).hidden = false;
    ask();
  }
  function ask() {
    const t = order[k];
    $('.find span', root).textContent = t.en;
    $('.find .ar', root).textContent = t.ar;
    $('.score', root).textContent = `${k}/${order.length}`;
  }
  function reveal(l, cls) {
    const d = dots[l.id];
    if (f.dense) {
      d.className = 'pin dot ok'; d.textContent = found.size;
      $('.legend', root).appendChild(el(`<li><b>${found.size}</b>${esc(S.set.arLabels ? l.ar : l.en)}</li>`));
      return;
    }
    d.className = 'pin ' + cls;
    const a = l.box[0] < 12 ? 'l' : l.box[2] > 88 ? 'r' : 'c';
    if (a === 'l') { d.style.left = l.box[0] + '%'; d.style.transform = 'translate(0,-50%)'; }
    else if (a === 'r') { d.style.left = l.box[2] + '%'; d.style.transform = 'translate(-100%,-50%)'; }
    d.textContent = S.set.arLabels ? l.ar : (l.short || l.en);
  }
  fig.addEventListener('click', e => {
    if (k >= order.length) return;
    const r = fig.getBoundingClientRect();
    let best = null, bd = 1e9;
    targets.forEach(l => {
      if (found.has(l.id)) return;
      const [x, y] = pinCenter(l);
      const dx = r.left + r.width * x / 100 - e.clientX, dy = r.top + r.height * y / 100 - e.clientY;
      const dd = Math.hypot(dx, dy);
      if (dd < bd) { bd = dd; best = l; }
    });
    if (!best || bd > 46) return;
    const t = order[k];
    if (best.id === t.id) {
      sfx.ok(); found.add(t.id); reveal(t, 'ok'); k++;
      if (k === order.length) finish(); else ask();
    } else {
      sfx.bad(); errors++;
      const d = dots[best.id];
      d.classList.add('bad'); d.textContent = best.short || best.en; d.classList.remove('dot');
      setTimeout(() => { if (!found.has(best.id)) { d.className = 'pin dot'; d.textContent = ''; } }, 1100);
    }
  });
  $('[data-hint]', root).onclick = () => {
    if (k >= order.length) return;
    errors++;
    const d = dots[order[k].id]; d.classList.add('pulse');
    setTimeout(() => d.classList.remove('pulse'), 2400);
  };
  function finish() {
    sfx.win();
    $('.find span', root).textContent = 'All found';
    $('.find .ar', root).textContent = '';
    $('.score', root).textContent = `${order.length}/${order.length}`;
    $('[data-hint]', root).hidden = true;
    const msg = errors ? `${order.length} structures found · ${errors} miss${errors > 1 ? 'es' : ''}` : `${order.length}/${order.length} with no misses`;
    $('.after', root).appendChild(winBar(msg, start));
    done && done({ total: order.length, errors });
  }
  start();
};

/* Order on the figure: pick each station in sequence; a drop travels the route */
IX.order = function (spec, host, done) {
  const f = spec.fig ? FIGS[spec.fig] : null;
  const path = spec.path ? f.paths[spec.path] : null;
  const items = spec.items.map(id => typeof id === 'object' ? id : (f && labelById(spec.fig, id)) || { id, en: id, ar: '' });
  let k, errors, chips, drop, at;
  const root = el(`<div class="ix">
    <div class="prompt"><div class="find"><small>${esc(spec.promptSmall || 'Build the route')}</small><span>${esc(spec.prompt || 'Tap the stations in order')}</span></div><span class="score"></span></div>
    <div class="figslot"></div>
    <ol class="seq"></ol>
    <div class="tray"></div><div class="after"></div></div>`);
  host.appendChild(root);
  const fig = f ? figureEl(spec.fig, { labels: !!spec.showOtherLabels, only: spec.showOtherLabels }) : el('<div></div>');
  if (f) $('.figslot', root).appendChild(zoomable(fig));
  function pt(i) { const p = path[i].pt; return { left: p[0] + '%', top: p[1] + '%' }; }
  function stopIndex(id) { return path ? path.findIndex(p => p.stop === id) : -1; }
  function travel(toIdx, cb) {
    if (!path) return cb && cb();
    if (!drop) { drop = el('<span class="drop"></span>'); fig.appendChild(drop); Object.assign(drop.style, pt(toIdx)); at = toIdx; return cb && cb(); }
    const frames = [];
    for (let i = at; i <= toIdx; i++) frames.push(pt(i));
    at = toIdx;
    const end = frames[frames.length - 1];
    if (REDUCED || frames.length < 2 || !drop.animate) { Object.assign(drop.style, end); return cb && cb(); }
    const a = drop.animate(frames, { duration: 380 * (frames.length - 1), easing: 'ease-in-out' });
    a.onfinish = () => { Object.assign(drop.style, end); cb && cb(); };
  }
  function start() {
    k = 0; errors = 0; at = 0;
    if (drop) { drop.remove(); drop = null; }
    $$('.pin.ok', fig).forEach(p => p.remove());
    $('.seq', root).innerHTML = items.map(() => '<li>?</li>').join('');
    const tray = $('.tray', root); tray.innerHTML = '';
    chips = shuffle(items).map(it => {
      const b = el(`<button class="chipbtn" data-id="${it.id}">${esc(it.en)}</button>`);
      b.onclick = () => pick(it, b);
      tray.appendChild(b); return b;
    });
    $('.after', root).innerHTML = '';
    $('.score', root).textContent = `0/${items.length}`;
  }
  function pick(it, b) {
    if (k >= items.length) return;
    if (it.id === items[k].id) {
      sfx.ok(); b.classList.add('done');
      const li = $$('.seq li', root)[k]; li.classList.add('on'); li.textContent = it.en;
      if (it.box && f) { const p = pinEl(it, S.set.arLabels); p.classList.add('ok'); fig.appendChild(p); }
      k++; $('.score', root).textContent = `${k}/${items.length}`;
      const si = stopIndex(it.id);
      if (si >= 0) travel(si);
      if (k === items.length) {
        const last = path && path[path.length - 1];
        const fin = () => finish();
        if (last && !last.stop && at < path.length - 1) travel(path.length - 1, fin);
        else if (last && last.stop && !items.some(x => x.id === last.stop)) travel(path.length - 1, fin);
        else fin();
      }
    } else {
      sfx.bad(); errors++;
      b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
    }
  }
  function replay() {
    if (!path || !drop) return;
    at = 0; Object.assign(drop.style, pt(0));
    setTimeout(() => travel(path.length - 1), 60);
  }
  function finish() {
    sfx.win();
    const msg = errors ? `Route complete · ${errors} wrong pick${errors > 1 ? 's' : ''}` : 'Perfect route, no wrong picks';
    const w = winBar(msg, start);
    if (path) { const r = el(`<button class="btn small">${I.play} Replay</button>`); r.onclick = replay; w.insertBefore(r, $('[data-again]', w)); }
    $('.after', root).appendChild(w);
    if (spec.endText) $('.after', root).appendChild(el(`<p class="muted" style="font-size:14px">${spec.endText}</p>`));
    done && done({ total: items.length, errors });
  }
  start();
};

/* Sort into bins */
IX.sort = function (spec, host, done) {

/* ---------- three.js loader (lazy, cdnjs) ---------- */
let _three = null;
function loadThree() {
  if (window.THREE) return Promise.resolve(window.THREE);
  if (_three) return _three;
  _three = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload = () => window.THREE ? res(window.THREE) : rej(new Error('no THREE'));
    s.onerror = () => { _three = null; rej(new Error('load failed')); };
    document.head.appendChild(s);
  });
  return _three;
}

/* shared 3D stage: renderer, camera, drag-rotate, pinch/wheel zoom, tap-pick, lifecycle */
function stage3d(host, opts, build) {
  const box = el(`<div class="stage3d"><div class="cv"></div>
    <div class="hud"><span class="hint">Drag · pinch · tap a part</span></div>
    <div class="pick" aria-live="polite" hidden></div>
    <div class="fallback" hidden></div></div>`);
  host.appendChild(box);
  const cv = $('.cv', box), pick = $('.pick', box);
  const api = { box, pick, onFrame: [], pickables: [], onPick: null };
  loadThree().then(THREE => {
    const W = () => cv.clientWidth, H = () => cv.clientHeight;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(W(), H());
    renderer.localClippingEnabled = true;
    cv.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, W() / H(), 0.1, 100);
    camera.position.set(0, 0, opts.dist || 6);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.85));
    const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(3, 4, 5); scene.add(dl);
    const dl2 = new THREE.DirectionalLight(0x88ccff, 0.35); dl2.position.set(-4, -2, -3); scene.add(dl2);
    const root = new THREE.Group(); scene.add(root);
    Object.assign(api, { THREE, scene, camera, renderer, root });
    build(api);
    let rx = opts.rx || 0.15, ry = opts.ry || 0.5, drag = null, moved = false, auto = !REDUCED, pinch = null;
    const cvs = renderer.domElement;
    cvs.style.touchAction = 'none';
    const pts = new Map();
    cvs.addEventListener('pointerdown', e => { pts.set(e.pointerId, [e.clientX, e.clientY]); cvs.setPointerCapture(e.pointerId); drag = [e.clientX, e.clientY, rx, ry]; moved = false; auto = false; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = [Math.hypot(a[0] - b[0], a[1] - b[1]), camera.position.z]; } });
    cvs.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); camera.position.z = Math.max(opts.min || 3, Math.min(opts.max || 10, pinch[1] * pinch[0] / d)); moved = true; return; }
      if (!drag) return;
      const dx = e.clientX - drag[0], dy = e.clientY - drag[1];
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      ry = drag[3] + dx * 0.01; rx = Math.max(-1.3, Math.min(1.3, drag[2] + dy * 0.01));
    });
    const up = e => {
      pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
      if (drag && !moved) doPick(e);
      drag = null;
    };
    cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up);
    cvs.addEventListener('wheel', e => { e.preventDefault(); camera.position.z = Math.max(opts.min || 3, Math.min(opts.max || 10, camera.position.z + e.deltaY * 0.004)); }, { passive: false });
    const ray = new THREE.Raycaster(), v2 = new THREE.Vector2();
    function doPick(e) {
      const r = cvs.getBoundingClientRect();
      v2.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(v2, camera);
      const hits = ray.intersectObjects(api.pickables, false).filter(h => {
        const m = h.object.material; if (!m.clippingPlanes || !m.clippingPlanes.length) return true;
        return m.clippingPlanes.every(p => p.distanceToPoint(h.point) >= -1e-3);
      });
      if (hits.length) {
        const o = hits[0].object;
        api.onPick ? api.onPick(o) : showPick(o);
      }
    }
    function showPick(o) {
      const u = o.userData;
      pick.hidden = false;
      pick.innerHTML = `<b>${esc(u.en)}</b><span class="ar">${esc(u.ar || '')}</span>${u.note ? `<p>${esc(u.note)}</p>` : ''}`;
      flash(o);
    }
    api.showPick = showPick;
    function flash(o) {
      const m = o.material; if (!m.emissive) return;
      const old = m.emissive.getHex(); m.emissive.setHex(0x2fd3bf);
      setTimeout(() => m.emissive.setHex(old), 700);
    }
    api.flash = flash;
    const ro = new ResizeObserver(() => { renderer.setSize(W(), H()); camera.aspect = W() / H(); camera.updateProjectionMatrix(); });
    ro.observe(cv);
    let visible = true;
    const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; });
    io.observe(cv);
    let last = performance.now();
    (function loop(now) {
      if (!cvs.isConnected) { ro.disconnect(); io.disconnect(); renderer.dispose(); return; }
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!visible) return;
      if (auto) ry += dt * 0.25;
      root.rotation.set(rx, ry, 0);
      api.onFrame.forEach(f => f(dt, now / 1000));
      renderer.render(scene, camera);
    })(last);
  }).catch(() => {
    $('.hud', box).hidden = true;
    const fb = $('.fallback', box); fb.hidden = false;
    fb.innerHTML = opts.fallback || '<b>3D model could not load.</b> Check your connection and reopen this step.';
  });
  return api;
}

/* ---------- table drill: one row-fact at a time, misses come back until right ---------- */
IX.tdrill = function (spec, host, done) {
  const root = el(`<div class="ix">
    <div class="prompt"><div class="find"><small>${esc(spec.small || 'Table drill')}</small><span>${esc(spec.prompt || 'Pick the right answer')}</span></div><span class="score"></span></div>
    <div class="tdcard"></div><div class="after"></div></div>`);
  host.appendChild(root);

  function start() { queue = shuffle(spec.items.map((x, j) => j)); errors = 0; first = 0; total = queue.length; missed = new Set(); $('.after', root).innerHTML = ''; next(); }
  function next() {
    const box = $('.tdcard', root); box.innerHTML = '';

    if (!queue.length) {

      $('.after', root).appendChild(winBar(`${first}/${total} right on the first try`, start));

        else { sfx.bad(); errors++; b.classList.add('wrong'); $$('.opt', opts).forEach(x => { if (x.dataset.ok) x.classList.add('right'); }); missed.add(j); queue.push(queue.shift()); }
        if (it.why || !ok) box.appendChild(el(`<div class="callout ${ok ? 'why' : 'flag'}" style="margin-top:8px"><div>${ok ? '' : '<b>Answer: ' + it.a + '.</b> '}${it.why || ''}${!ok ? ' It will come back at the end.' : ''}</div></div>`));

/* ---------- 3D: red cells in a small vessel; cold makes them sickle and lodge ---------- */
IX.rbc3d = function (spec, host, done) {
  const root = el(`<div class="ix"></div>`); host.appendChild(root);

    const pts = []; for (let i = 0; i <= 12; i++) { const r = i / 12 * 0.5; pts.push(new THREE.Vector2(r, 0.09 + 0.1 * Math.pow(r / 0.5, 2) * (1 - Math.pow(r / 0.5, 6)) - 0.05 * (1 - r / 0.5))); }

    vessel.rotation.z = Math.PI / 2; g.add(vessel); a.pickables.push(vessel);
    const narrow = tag(new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.22, 12, 32), stdMat(THREE, 0xc97a7a, { transparent: true, opacity: 0.55 })), 'Narrow point', 'تضيّق', 'Narrow vessels, such as those of the spleen, are where sickle cells get stuck.');
    narrow.rotation.y = Math.PI / 2; narrow.position.x = 1.2; g.add(narrow); a.pickables.push(narrow);
    const cells = [];
    for (let i = 0; i < 16; i++) {
      const m = new THREE.Mesh(discGeo, stdMat(THREE, 0xd8343a, { roughness: 0.4 }));
      tag(m, 'Normal RBC', 'كرية حمراء طبيعية', 'Smooth, round shape: carries oxygen well.');
      m.userData.x = -4.5 + i * 0.6; m.userData.y = (Math.random() - 0.5) * 0.9; m.userData.z = (Math.random() - 0.5) * 0.9; m.userData.spin = Math.random() * 6; m.userData.s = i % 3 === 0 ? 0 : (i * 0.37) % 1; m.userData.stop = 0.35 - (i % 8) * 0.38;
      g.add(m); cells.push(m); a.pickables.push(m);

    clot.position.x = 1.0; clot.scale.set(0.01, 0.01, 0.01); g.add(clot); a.pickables.push(clot);

    <label class="rng"><span>Hematocrit</span><input id="vhct" type="range" min="15" max="70" step="1" value="44" aria-label="Hematocrit"></label>

  function drawTasks() { $('.tasks', root).innerHTML = tasks.map(([k, t]) => `<li class="${doneT[k] ? 'ok' : ''}">${doneT[k] ? '✓' : '○'} ${t}</li>`).join(''); }

/* ===== views ===== */
const DAY = 86400000;
const INTV = [1, 3, 7, 16, 35];
const SESSION = { miss: {} };

/* ---------- derived data ---------- */
const QINDEX = {}, FINDEX = {};
function indexContent() {
  MODULES.forEach(m => {
    const c = CONTENT[m.id]; if (!c) return;
    c.steps.forEach((s, i) => { if (s.t === 'q') QINDEX[s.q.id] = { q: s.q, mid: m.id, i }; });
    (c.flash || []).forEach(f => FINDEX[f.id] = Object.assign({ mid: m.id }, f));
  });
}
function ready(mid) { return !!CONTENT[mid]; }
function modById(mid) { return MODULES.find(m => m.id === mid); }

function flowOf(mid) {
  const c = CONTENT[mid];
  let st = c.steps.map((s, i) => Object.assign({ _i: i }, s));
  if (S.set.qmode === 'end') {
    const qs = st.filter(s => s.t === 'q');
    st = st.filter(s => s.t !== 'q');
    if (qs.length) st.push({ t: 'qhead', _i: -1 }, ...qs);
  }
  return [{ t: 'intro', _i: -1 }, ...st, { t: 'lockin', _i: -1 }, { t: 'recall', _i: -1 }, { t: 'hooks', _i: -1 }, { t: 'done', _i: -1 }];
}
function stepKey(s) { return s.t === 'q' ? s.q.id : s.id; }
function prog(mid) { return S.prog[mid] || (S.prog[mid] = { at: 0, seen: {}, ix: {}, done: false }); }
function modPct(mid) {
  if (!ready(mid)) return 0;
  const c = CONTENT[mid], p = S.prog[mid];
  if (!p) return 0;
  const keys = c.steps.map(stepKey);
  return pct(keys.filter(k => p.seen[k]).length, keys.length);
}
function accuracy() {
  let r = 0, t = 0;
  Object.values(S.qs).forEach(x => { t++; if (x.ok) r++; });
  return t ? pct(r, t) : null;
}

/* ---------- SRS ---------- */
function availableCards() {
  const out = [];
  MODULES.forEach(m => { if (S.started[m.id] && CONTENT[m.id]) (CONTENT[m.id].flash || []).forEach(f => out.push(FINDEX[f.id])); });
  return out;
}
function dueQueue() {
  const now = Date.now();
  const cards = availableCards();
  const lapsed = [], due = [], fresh = [];
  cards.forEach(c => {
    const s = S.srs[c.id];
    if (!s) fresh.push(c);
    else if (s.b === -1) lapsed.push(c);
    else if (s.due <= now) due.push(c);
  });
  due.sort((a, b) => S.srs[a.id].due - S.srs[b.id].due);
  return [...lapsed, ...due, ...fresh];
}
function gradeCard(id, ok) {
  const s = S.srs[id];
  if (ok) {
    const b = !s || s.b < 0 ? 0 : Math.min(s.b + 1, 4);
    S.srs[id] = { b, due: Date.now() + INTV[b] * DAY };
  } else {
    S.srs[id] = { b: -1, due: Date.now(), lapsed: true };
  }
  save();
}
function nextDueText() {
  const future = availableCards().map(c => S.srs[c.id]).filter(s => s && s.b >= 0).map(s => s.due);
  if (!future.length) return '';
  const d = Math.min(...future) - Date.now();
  if (d <= 0) return 'now';
  const h = Math.round(d / 3600000);
  return h < 24 ? `in ${Math.max(1, h)} h` : `in ${Math.round(d / DAY)} day${Math.round(d / DAY) > 1 ? 's' : ''}`;
}

/* ---------- router ---------- */
const R = { view: 'home', params: {}, stack: [] };
function go(view, params = {}, replace = false) {
  if (!replace) R.stack.push({ view: R.view, params: R.params });
  R.view = view; R.params = params;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
function back() {
  const p = R.stack.pop();
  if (p) { R.view = p.view; R.params = p.params; } else { R.view = 'home'; R.params = {}; }
  render();
  window.scrollTo(0, 0);
}
const NAV = [['home', 'Home', 'home'], ['learn', 'Learn', 'learn'], ['cards', 'Cards', 'cards'], ['search', 'Search', 'search'], ['more', 'More', 'more']];
const NAVOF = { home: 'home', learn: 'learn', module: 'learn', cards: 'cards', search: 'search', more: 'more', mistakes: 'more', settings: 'more', arabic: 'more', exam: 'more', numbers: 'more', cheat: 'more', hub: 'more', lab: 'more' };

function render() {
  const app = $('#app');
  app.innerHTML = '';
  const view = VIEWS[R.view] || VIEWS.home;
  view(app, R.params);

/* ---------- flow-cell strip for the home analyzer: red cells drifting through a capillary ---------- */
function flowStrip() {
  let cells = '';
  for (let i = 0; i < 18; i++) {
    const x = Math.round(i * 600 / 18 + (i * 13 % 17)), y = 13 + (i * 37 % 21), r = 5 + (i % 3), d = ((i * 0.83) % 7).toFixed(2);
    const kind = i % 7 === 3 ? 'wbc' : i % 5 === 2 ? 'plt' : 'rbc';
    const st = `style="--x:${x}px;animation-delay:-${d}s"`;
    cells += kind === 'rbc' ? `<ellipse class="rbc" cx="${x}" cy="${y}" rx="${r + 2.5}" ry="${r}" ${st}/>`
      : kind === 'wbc' ? `<circle class="wbc" cx="${x}" cy="${y}" r="${r + 2}" ${st}/>`
      : `<circle class="plt" cx="${x}" cy="${y}" r="2.2" ${st}/>`;
  }
  return `<svg class="flow" viewBox="0 0 600 46" preserveAspectRatio="xMinYMid slice" aria-hidden="true"><path class="wall" d="M0 3H600M0 43H600"/>${cells}</svg>`;
}

VIEWS.module = (app, { mid }) => {
  const mod = modById(mid), c = CONTENT[mid], p = prog(mid);

  const step = flow[p.at];
  S.last = { mid }; save();

  c.steps.forEach(s => counts[s.t]++);
  const tb = topBar(mod.title, `Module ${mod.n} · ${stepLabel(step, flow, p.at)}`, { back: true, close: true, onBack: () => { R.stack = []; go('home', {}, true); }, progress: Math.round(100 * p.at / (flow.length - 1)) });
  const arb = el(`<button class="ibtn txt" aria-label="Arabic summary">ع</button>`);
  arb.onclick = () => go('arabic', { mid });
  $('.acts', tb).appendChild(arb);
  app.appendChild(tb);
  const m = mainEl(); app.appendChild(m);
  const wrap = el('<section class="step"></section>'); m.appendChild(wrap);

  let canGo = true;
  const bar = el(`<div class="stepbar"><div class="row">
    <button class="btn ghost small" data-prev aria-label="Previous step" ${p.at === 0 ? 'disabled' : ''}>${I.prev}</button>
    <span class="count">${p.at + 1} / ${flow.length}</span>
    <button class="btn primary" data-next>Continue ${I.next}</button></div></div>`);
  const nextBtn = $('[data-next]', bar);
  function setNext(label, enabled = true) { nextBtn.innerHTML = `${label} ${I.next}`; nextBtn.disabled = !enabled; canGo = enabled; }
  $('[data-prev]', bar).onclick = () => { p.at = Math.max(0, p.at - 1); save(); render(); window.scrollTo(0, 0); };
  nextBtn.onclick = () => {
    if (!canGo) return;

    w.appendChild(el(`<p class="lede">You have no open misses in this module. Next: recall it all from memory.</p>`));

  const queue = shuffle([...ids]);
  const total = queue.length;
  w.appendChild(el(`<h2>Your misses, once more</h2>`));
  const info = el(`<p class="lede">Each question you missed comes back until you get it right. <span class="mono muted" data-left></span></p>`);

let SEARCH = null;
function buildSearch() {
  SEARCH = [];
  MODULES.forEach(m => {
    const c = CONTENT[m.id]; if (!c) return;
    const flow = flowOf(m.id);
    const at = s => flow.findIndex(f => f._i === s);
    c.steps.forEach((s, i) => {
      const where = `Module ${m.n} · ${m.title}`;
      if (s.t === 'card') SEARCH.push({ kind: 'Card', title: s.title, text: strip(s.body.join(' ') + ' ' + (s.cap || '') + ' ' + (s.hook || '') + ' ' + (s.flag || '')), where, go: () => openModule(m.id, at(i)) });
      if (s.t === 'ix') SEARCH.push({ kind: 'Interactive', title: s.title, text: strip(s.intro || ''), where, go: () => openModule(m.id, at(i)) });
      if (s.t === 'q') SEARCH.push({ kind: 'Question', title: strip(s.q.stem), text: strip((s.q.opts ? 'Answer: ' + s.q.opts[0] + ' · ' : '') + (s.q.why || s.q.model || '')), where, go: () => openModule(m.id, at(i)) });
      if (s.t === 'card' && s.fig) ((FIGS[s.fig] && FIGS[s.fig].labels) || []).forEach(l => { SEARCH.push({ kind: 'Figure label', title: l.en + ' · ' + l.ar, text: l.note || '', where: where + ' · figure', go: () => openModule(m.id, at(i)), key: s.fig + l.id }); });
    });
    (c.flash || []).forEach(f => SEARCH.push({ kind: 'Flashcard', title: strip(f.f), text: strip(f.b), where: `Module ${m.n} · flashcards`, go: () => go('cards') }));
    (c.hooks || []).forEach(h => SEARCH.push({ kind: 'Memory hook', title: h.t, text: h.d, where: `Module ${m.n} · hooks`, go: () => openModule(m.id, flow.findIndex(f => f.t === 'hooks')) }));
  });
  ENTITIES.forEach(e => SEARCH.push({ kind: e.ty === 'Drug' ? 'Drug / treatment' : e.ty, title: e.n + ' · ' + e.ar, text: strip(e.def + ' ' + (e.find || '') + ' ' + (e.care || '')), where: `Entity hub · Module ${modById(e.mid).n}`, go: () => go('hub') }));
  TABLES.filter(t => ready(t.mid)).forEach(t => SEARCH.push({ kind: 'Table', title: t.title, text: strip(t.html), where: `Cheat sheet · Module ${modById(t.mid).n}`, go: () => go('cheat') }));
  NUMBERS.forEach(n => SEARCH.push({ kind: 'Number', title: n.q + ': ' + n.a, text: 'Source ' + n.src, where: `Numbers drill · Module ${modById(n.mid).n}`, go: () => go('numbers') }));

  SEARCH = SEARCH.filter(x => { const k = x.kind + x.title; if (seen.has(k)) return false; seen.add(k); return true; });
}
function hl(text, terms) {
  let t = esc(text);
  terms.forEach(w => { if (w.length > 1) t = t.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });

}

}
function modStats(mid) {

  qs.forEach(({ q }) => { const x = S.qs[q.id]; if (x) { t++; if (x.ok) r++; } });

}

function mixedPool(n) {
  const all = allQs(null, false);
  const score = ({ q, mid }) => {
    const x = S.qs[q.id], st = modStats(mid);
    let w = Math.random();
    if (S.mist[q.id]) w += 3;
    if (!x) w += 1.2;
    if (st.p != null) w += (1 - st.p) * 2;
    return w;
  };
  const picked = all.map(o => ({ o, w: score(o) })).sort((a, b) => b.w - a.w).slice(0, n).map(x => x.o);
  // interleave: avoid two in a row from the same module
  const out = []; const rest = shuffle(picked);
  while (rest.length) { const i = rest.findIndex(x => !out.length || x.mid !== out[out.length - 1].mid); out.push(rest.splice(i < 0 ? 0 : i, 1)[0]); }
  return out;
}
function runExam(m, pool, cfg) {
  if (!pool.length) { m.appendChild(el('<div class="empty"><b>No questions in that selection.</b></div>')); return; }

  const head = el(`<div class="prompt" style="margin-bottom:14px"><div class="find"><small>${cfg.mixed ? 'Mixed review' : 'Exam'}</small><span data-n></span></div><span class="timer" data-t></span></div>`);
  const host = el('<div></div>');
  m.append(head, host);
  const start = Date.now();
  if (cfg.timer) {
    tick = setInterval(() => {
      if (!head.isConnected) return clearInterval(tick);
      left--; $('[data-t]', head).textContent = fmt(left);
      if (left <= 0) { clearInterval(tick); toast('Time is up'); finish(); }
    }, 1000);
    $('[data-t]', head).textContent = fmt(left);
  }
  function fmt(s) { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  function show() {
    host.innerHTML = '';
    if (i >= pool.length) return finish();
    $('[data-n]', head).textContent = `Question ${i + 1} of ${pool.length}`;
    const { q, mid } = pool[i];
    host.appendChild(el(`<p class="eyebrow" style="margin-bottom:8px">Module ${modById(mid).n} · ${esc(modById(mid).title)}</p>`));
    renderQ(q, host, {
      quiet: cfg.fb === 'end' && q.type !== 'sa',
      onAnswer: (ok, pick) => {
        res.push({ q, mid, ok, pick });
        const nb = el(`<button class="btn primary" style="margin-top:14px">${i + 1 < pool.length ? 'Next' : 'Finish'} ${I.next}</button>`);
        nb.onclick = () => { i++; show(); window.scrollTo(0, 0); };
        host.appendChild(nb);
        if (cfg.fb === 'end' && q.type !== 'sa') setTimeout(() => nb.isConnected && nb.click(), 350);
      }
    });
  }
  function finish() {
    if (tick) clearInterval(tick);
    host.innerHTML = ''; head.remove();
    const right = res.filter(r => r.ok).length;
    const secs = Math.round((Date.now() - start) / 1000);
    host.appendChild(el(`<div class="done"><span class="tag teach">${cfg.mixed ? 'Mixed review' : 'Exam'} complete</span><div class="big">${pct(right, res.length)}%</div><p class="muted">${right} of ${res.length} correct${res.length < pool.length ? ` · ${pool.length - res.length} unanswered` : ''} · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>`));
    const by = {};
    res.forEach(r => { (by[r.mid] = by[r.mid] || { r: 0, t: 0 }); by[r.mid].t++; if (r.ok) by[r.mid].r++; });
    const rows = Object.entries(by).map(([mid, v]) => ({ mid, ...v, p: v.r / v.t })).sort((a, b) => a.p - b.p);
    const sec = el(`<section class="sect"><header><h2>Weakest first</h2></header><div class="bars"></div></section>`);
    rows.forEach(r => {
      const mod = modById(r.mid), col = r.p >= 0.8 ? 'var(--teal)' : r.p >= 0.5 ? 'var(--amber)' : 'var(--coral)';
      const b = el(`<div class="bar"><span><b>${mod.n}. ${esc(mod.title)}</b></span><span class="mono">${r.r}/${r.t}</span><div class="track"><i style="width:${r.p * 100}%;background:${col}"></i></div><button class="btn small" style="grid-column:1/-1;justify-self:start">Drill module ${mod.n}</button></div>`);
      $('button', b).onclick = () => { m.innerHTML = ''; runExam(m, shuffle(allQs([r.mid], false)).slice(0, 12), { timer: 0, fb: 'instant' }); };

    if (wrong.length) {
      const rv = el(`<section class="sect"><header><h2>Review your misses</h2></header><div class="list"></div></section>`);
      wrong.forEach(r => rv.querySelector('.list').appendChild(el(`<div class="set"><p class="eyebrow">Module ${modById(r.mid).n}</p><b style="font-size:15px">${r.q.stem}</b><p style="color:var(--coral);font-size:14px">Your answer: ${r.pick != null ? r.q.opts[r.pick] : '—'}</p><p style="color:var(--teal);font-size:14px">Correct: ${r.q.opts[0]}</p><p style="font-size:14px;color:var(--text2)">${r.q.why}</p>${r.q.trap && r.q.trap[0] > 0 ? `<p style="font-size:13.5px;color:var(--muted)">Tempting wrong answer “${strip(r.q.opts[r.q.trap[0]])}”: ${r.q.trap[1]}</p>` : ''}</div>`)));
      host.appendChild(rv);
    }
    const again = el(`<button class="btn block" style="margin-top:16px">New exam</button>`); again.onclick = () => go('exam', {}, true);
    host.appendChild(again);
  }
  show();
}

/* ---------- numbers drill ---------- */
VIEWS.numbers = (app) => {
  app.appendChild(topBar('Numbers drill', `${NUMBERS.length} values from both files${MODULES.some(x => !ready(x.id)) ? ' (built modules)' : ''}`, { back: true }));
  const m = mainEl(); app.appendChild(m);
  const list = shuffle(NUMBERS);
  let i = 0, right = 0, streak = 0, best = 0;
  const head = el(`<div class="stats" style="margin-bottom:14px"><div><b data-s>0</b><span>streak</span></div><div><b data-r>0/0</b><span>correct</span></div><div><b data-b>0</b><span>best streak</span></div></div>`);
  const host = el('<div></div>');
  m.append(head, host);
  function show() {
    host.innerHTML = '';
    if (i >= list.length) {
      sfx.win();
      host.appendChild(el(`<div class="done"><span class="tag teach">All numbers done</span><div class="big">${right}/${list.length}</div></div>`));
      const b = el(`<button class="btn block" style="margin-top:12px">Go again</button>`); b.onclick = () => go('numbers', {}, true); host.appendChild(b);
      const t = el(`<section class="sect"><header><h2>All values</h2></header><div class="tbl"><table><thead><tr><th>Value</th><th>Answer</th><th>Source</th></tr></thead><tbody>${NUMBERS.map(n => `<tr><td>${esc(n.q)}</td><td class="mono">${esc(n.a)}</td><td class="mono">${esc(n.src)}</td></tr>`).join('')}</tbody></table></div></section>`);
      host.appendChild(t); return;
    }
    const n = list[i];
    host.appendChild(el(`<p class="eyebrow">Module ${modById(n.mid).n} · ${n.src}</p>`));
    host.appendChild(el(`<p class="stem" style="font:700 20px/1.35 var(--f-display);margin:8px 0 14px">${esc(n.q)}</p>`));
    const opts = el('<div class="opts"></div>'); host.appendChild(opts);
    shuffle([n.a, ...n.d]).forEach((t, pos) => {
      const b = el(`<button class="opt"><span class="L">${'ABCD'[pos]}</span><span class="mono" style="font-size:16px">${esc(t)}</span></button>`);
      b.onclick = () => {
        const ok = t === n.a;
        $$('.opt', opts).forEach(x => { x.disabled = true; if (x.textContent.slice(1) === n.a) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        ok ? (sfx.ok(), right++, streak++) : (sfx.bad(), streak = 0);
        best = Math.max(best, streak);
        $('[data-s]', head).textContent = streak; $('[data-r]', head).textContent = `${right}/${i + 1}`; $('[data-b]', head).textContent = best;
        const nb = el(`<button class="btn primary" style="margin-top:12px">Next ${I.next}</button>`); nb.onclick = () => { i++; show(); };
        host.appendChild(nb);
      };
      opts.appendChild(b);
    });
  }
  show();
};

/* ---------- cheat sheet ---------- */
VIEWS.cheat = (app) => {
  app.appendChild(topBar('Cheat sheet', 'Every list, table and value', { back: true }));
  const m = mainEl(); app.appendChild(m);
  const box = el(`<div class="search"><div style="position:relative">${I.search}<input id="q-cheat" type="search" placeholder="Filter: “dialysis”, “50 mL”, “struvite”" aria-label="Filter the cheat sheet"></div></div>`);
  m.appendChild(box);
  const wrap = el('<div class="cs" style="margin-top:14px"></div>'); m.appendChild(wrap);
  MODULES.forEach(x => {
    const c = CONTENT[x.id]; if (!c) return;
    const blk = el(`<div class="blk" data-mod="${x.id}"><h3>${x.n}. ${esc(x.title)}</h3><ul>${c.flash.map(f => `<li data-t="${esc((strip(f.f) + ' ' + strip(f.b)).toLowerCase())}"><b>${f.f.replace(/\?$/, '')}:</b> ${f.b}</li>`).join('')}</ul></div>`);
    TABLES.filter(t => t.mid === x.id).forEach(t => blk.appendChild(el(`<div data-t="${esc(strip(t.html).toLowerCase())}">${t.html}</div>`)));
    wrap.appendChild(blk);
  });
  const inp = $('input', box);
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase();
    $$('.blk', wrap).forEach(b => {
      let any = false;
      $$('[data-t]', b).forEach(li => { const hit = !q || li.dataset.t.includes(q); li.hidden = !hit; any = any || hit; });
      b.hidden = !any;
    });
  };
};

/* ---------- entity hub ---------- */
VIEWS.hub = (app) => {
  app.appendChild(topBar('Entity hub', `${ENTITIES.length} conditions, cells, organs and tests`, { back: true }));
  const m = mainEl(); app.appendChild(m);
  let type = 'All', sel = [];
  const top = el(`<div style="display:grid;gap:10px">
    <button class="btn primary block" data-quiz>${I.spark} Which one is it? (10 rounds)</button>
    <div class="filters">${['All', ...new Set(ENTITIES.map(e => e.ty))].map(t => `<button data-ty="${t}" aria-pressed="${t === 'All'}">${t === 'All' ? 'All' : t.endsWith('s') ? t + 'es' : t + 's'}</button>`).join('')}</div>
    <p class="muted" style="font-size:13.5px">Tap two cards to compare them side by side.</p>
    <div class="cmpbox"></div></div>`);
  m.appendChild(top);
  const grid = el('<div class="list"></div>'); m.appendChild(grid);
  function card(e, full) {
    return `<span class="ty">${e.ty} · Module ${modById(e.mid).n}</span><b>${esc(e.n)}</b><span class="ar" style="font-size:13px;text-align:left">${esc(e.ar)}</span>
      <dl><dt>What it is</dt><dd>${e.def}</dd>${e.find ? `<dt>${e.ty === 'Condition' ? 'Findings' : 'Details'}</dt><dd>${e.find}</dd>` : ''}${e.care ? `<dt>${e.ty === 'Condition' ? 'Care' : 'Remember'}</dt><dd>${e.care}</dd>` : ''}</dl>${e.src ? `<span class="src">Source: ${esc(e.src)}</span>` : ''}`;
  }
  function draw() {
    grid.innerHTML = '';
    ENTITIES.filter(e => type === 'All' || e.ty === type).forEach(e => {
      const b = el(`<button class="ent ${sel.includes(e.id) ? 'sel' : ''}">${card(e)}</button>`);
      if (e.img) { const f = figureEl(e.img, { labels: false }); f.style.maxWidth = '220px'; b.appendChild(f); }
      b.onclick = () => { sel = sel.includes(e.id) ? sel.filter(x => x !== e.id) : [...sel, e.id].slice(-2); sfx.tap(); draw(); cmp(); };
      grid.appendChild(b);
    });
  }
  function cmp() {
    const box = $('.cmpbox', top); box.innerHTML = '';
    if (sel.length < 2) return;
    const [a, b] = sel.map(id => ENTITIES.find(e => e.id === id));
    const c = el(`<div><p class="eyebrow" style="margin-bottom:8px">Side by side</p><div class="cmp"><div class="ent">${card(a)}</div><div class="ent">${card(b)}</div></div><button class="btn small" style="margin-top:8px" data-clr>Clear</button></div>`);
    $('[data-clr]', c).onclick = () => { sel = []; draw(); cmp(); };
    box.appendChild(c);
  }
  $$('[data-ty]', top).forEach(b => b.onclick = () => { type = b.dataset.ty; $$('[data-ty]', top).forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  $('[data-quiz]', top).onclick = () => { m.innerHTML = ''; whichOne(m); };
  draw();
};
function whichOne(m) {
  let i = 0, right = 0;
  const conds = ENTITIES.filter(e => e.def && e.ty === 'Condition');
  const rounds = shuffle(conds.length >= 10 ? conds : ENTITIES.filter(e => e.def)).slice(0, 10);
  const host = el('<div></div>'); m.appendChild(host);
  function show() {
    host.innerHTML = '';
    if (i >= rounds.length) {
      sfx.win();
      host.appendChild(el(`<div class="done"><span class="tag teach">Which one is it?</span><div class="big">${right}/${rounds.length}</div></div>`));
      const b = el(`<button class="btn block" style="margin-top:12px">Back to the hub</button>`); b.onclick = () => go('hub', {}, true); host.appendChild(b); return;
    }
    const e = rounds[i];
    const same = shuffle(ENTITIES.filter(x => x.ty === e.ty && x.id !== e.id)).slice(0, 3);
    const clue = Math.random() < 0.5 && e.find ? e.find : e.def;
    host.appendChild(el(`<p class="eyebrow">Round ${i + 1} of ${rounds.length} · ${e.ty}</p>`));
    host.appendChild(el(`<div class="alarm-card" style="margin:10px 0"><div class="ah"><span class="dot"></span>Clue</div><p style="font-size:16px">${clue}</p></div>`));
    const opts = el('<div class="opts"></div>'); host.appendChild(opts);
    shuffle([e, ...same]).forEach((o, pos) => {
      const b = el(`<button class="opt"><span class="L">${'ABCD'[pos]}</span><span>${esc(o.n)}</span></button>`);
      b.onclick = () => {
        const ok = o.id === e.id;
        $$('.opt', opts).forEach(x => x.disabled = true);
        b.classList.add(ok ? 'right' : 'wrong');
        if (!ok) $$('.opt', opts).find(x => x.textContent.slice(1) === e.n)?.classList.add('right');
        ok ? (sfx.ok(), right++) : sfx.bad();
        host.appendChild(el(`<div class="callout why" style="margin-top:10px"><span class="h">${esc(e.n)}</span><div>${e.def}${e.care ? ' <b>Care:</b> ' + e.care : ''}</div></div>`));
        const nb = el(`<button class="btn primary small" style="margin-top:10px">Next ${I.next}</button>`); nb.onclick = () => { i++; show(); }; host.appendChild(nb);
      };
      opts.appendChild(b);
    });
  }
  show();
}

/* ---------- visual lab ---------- */
VIEWS.lab = (app, params) => {
  app.appendChild(topBar('Visual lab', 'Figures, photos, ECGs and every interactive', { back: true }));
  const m = mainEl(); app.appendChild(m);
  let tab = params.tab || 'figs';
  const tabs = el(`<div class="filters">${[['figs', 'Figures & photos'], ['ix', 'Interactives'], ['quiz', 'Picture quiz']].map(([k, t]) => `<button data-k="${k}" aria-pressed="${k === tab}">${t}</button>`).join('')}</div>`);
  const body = el('<div></div>');
  m.append(tabs, body);
  $$('button', tabs).forEach(b => b.onclick = () => { tab = b.dataset.k; R.params.tab = tab; $$('button', tabs).forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  function draw() {
    body.innerHTML = '';
    if (tab === 'figs') {
      const g = el('<div class="gallery"></div>');
      Object.keys(IMG).forEach(k => {
        const b = el(`<button><div class="th"><img src="${IMG[k]}" alt="" loading="lazy"></div><b>${esc(IMG_TITLES[k] || k)}</b><span class="src" style="padding:0 4px 4px">Module ${modById(IMG_MOD[k] || 'm1').n}</span></button>`);
        b.onclick = () => openLightbox(k, { title: IMG_TITLES[k] || k });
        g.appendChild(b);
      });
      body.appendChild(g);
    }
    if (tab === 'ix') {
      const g = el('<div class="gallery"></div>');
      MODULES.forEach(x => { const c = CONTENT[x.id]; if (!c) return; const flow = flowOf(x.id);
        c.steps.forEach((s, i) => { if (s.t !== 'ix') return;
          const ic = s.kind.includes('3d') ? I.hub : s.kind === 'ecg' ? I.drill : s.kind === 'triage' ? I.mistake : I.spark;
          const thumb = s.spec && s.spec.fig && IMG[s.spec.fig] ? `<div class="th"><img src="${IMG[s.spec.fig]}" alt="" loading="lazy"></div>` : s.spec && s.spec.a ? `<div class="th"><img src="${IMG[s.spec.a.img]}" alt="" loading="lazy"></div>` : `<div class="th ix">${ic}</div>`;
          const b = el(`<button>${thumb}<b>${esc(s.title)}</b><span class="src" style="padding:0 4px 4px">${esc(IX_NAMES[s.kind] || s.kind)} · M${x.n}</span></button>`);
          b.onclick = () => openModule(x.id, flow.findIndex(f => f._i === i));
          g.appendChild(b);
        }); });
      body.appendChild(g);
    }
    if (tab === 'quiz') picQuiz(body);
  }
  draw();
};
function picQuiz(host) {
  const rounds = shuffle(PICQ).slice(0, 10);
  let i = 0, right = 0;
  function show() {
    host.innerHTML = '';
    if (i >= rounds.length) {
      sfx.win();
      host.appendChild(el(`<div class="done"><span class="tag teach">Picture quiz</span><div class="big">${right}/${rounds.length}</div></div>`));
      const b = el(`<button class="btn block" style="margin-top:12px">Play again</button>`); b.onclick = () => { i = 0; right = 0; rounds.sort(() => Math.random() - .5); show(); }; host.appendChild(b); return;
    }
    const r = rounds[i];
    host.appendChild(el(`<p class="eyebrow" style="margin-bottom:8px">Picture ${i + 1} of ${rounds.length} · What is this?</p>`));
    const f = figureEl(r.img, { labels: false }); f.style.maxWidth = '520px'; f.style.marginInline = 'auto'; f.onclick = () => openLightbox(r.img, { title: 'What is this?', labels: false });
    host.appendChild(f);
    const opts = el('<div class="opts" style="margin-top:12px"></div>'); host.appendChild(opts);
    shuffle([r.a, ...r.d]).forEach((t, pos) => {
      const b = el(`<button class="opt"><span class="L">${'ABCD'[pos]}</span><span>${esc(t)}</span></button>`);
      b.onclick = () => {
        const ok = t === r.a;
        $$('.opt', opts).forEach(x => { x.disabled = true; if (x.textContent.slice(1) === r.a) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        ok ? (sfx.ok(), right++) : sfx.bad();
        const nb = el(`<button class="btn primary small" style="margin-top:10px">Next ${I.next}</button>`); nb.onclick = () => { i++; show(); }; host.appendChild(nb);
      };
      opts.appendChild(b);
    });
  }
  show();
}

indexContent();
applyTheme();
render();

  const mq = matchMedia('(prefers-color-scheme: light)');

  mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
}
claudeReady.then(() => $$('[data-needs-claude]').forEach(n => n.hidden = !SAMPLE));

</script>
