<title>Renal &amp; GU Emergencies</title>
<meta name="description" content="Interactive study course for Chapter 22: Genitourinary and Renal Emergencies (BSc EMS).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ===== Tokens: dark-first clinical palette ===== */
:root{
  color-scheme: dark;
  --bg:#081215; --bg2:#0c191d; --surface:#0f1f23; --surface2:#15292e; --surface3:#1b333a;
  --line:#21393f; --line2:#2c4a52;
  --text:#e2eef0; --text2:#b9ccd0; --muted:#839ea4;
  --teal:#2fd3bf; --teal-ink:#032621; --teal-soft:rgba(47,211,191,.13);
  --cyan:#48c9ea; --cyan-soft:rgba(72,201,234,.12);
  --amber:#f3b746; --amber-ink:#2b1c00; --amber-soft:rgba(243,183,70,.14);
  --coral:#ff6f61; --coral-soft:rgba(255,111,97,.14);
  --fig-bg:#ffffff; --pin-bg:rgba(8,18,21,.9); --pin-text:#f2f8f8;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:16px;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ar:"IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top-h:56px; --nav-h:62px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#eef4f4; --bg2:#e5eeef; --surface:#ffffff; --surface2:#f3f8f8; --surface3:#e7f0f1;
    --line:#d3e1e3; --line2:#bcd0d3;
    --text:#0c2227; --text2:#2d474d; --muted:#5b7479;
    --teal:#0a8a7b; --teal-ink:#ffffff; --teal-soft:rgba(10,138,123,.10);
    --cyan:#0a7699; --cyan-soft:rgba(10,118,153,.09);
    --amber:#a36300; --amber-ink:#ffffff; --amber-soft:rgba(214,146,20,.16);
    --coral:#cf3b2c; --coral-soft:rgba(207,59,44,.10);
    --pin-bg:rgba(12,34,39,.9);
    --shadow:0 8px 24px rgba(12,34,39,.12);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#eef4f4; --bg2:#e5eeef; --surface:#ffffff; --surface2:#f3f8f8; --surface3:#e7f0f1;
  --line:#d3e1e3; --line2:#bcd0d3;
  --text:#0c2227; --text2:#2d474d; --muted:#5b7479;
  --teal:#0a8a7b; --teal-ink:#ffffff; --teal-soft:rgba(10,138,123,.10);
  --cyan:#0a7699; --cyan-soft:rgba(10,118,153,.09);
  --amber:#a36300; --amber-ink:#ffffff; --amber-soft:rgba(214,146,20,.16);
  --coral:#cf3b2c; --coral-soft:rgba(207,59,44,.10);
  --pin-bg:rgba(12,34,39,.9);
  --shadow:0 8px 24px rgba(12,34,39,.12);
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.58 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.ar,[lang="ar"]{font-family:var(--f-ar);direction:rtl;text-align:right;line-height:1.85}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 11.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* key terms + numbers inside teaching text */
k{color:var(--amber);font-weight:600;background:var(--amber-soft);border-radius:4px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
n{font-family:var(--f-mono);font-weight:600;font-size:.94em;color:var(--cyan);background:var(--cyan-soft);border-radius:4px;padding:0 4px;white-space:nowrap}
em{font-style:italic;color:var(--text2)}

/* ===== Shell ===== */
#app{min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--top-h);display:flex;align-items:center;gap:6px;padding-inline:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.top .ttl b{font:700 16px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font:500 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--text2)}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:22px;height:22px}
.ibtn.txt{width:auto;padding-inline:10px;font:600 13px var(--f-ar)}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));transition:width .35s ease}

main.view{max-width:760px;margin-inline:auto;padding-inline:16px;padding-block:18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px);background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.bottom .row{max-width:760px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 11px var(--f-body);color:var(--muted);position:relative;min-height:44px}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button[aria-current="page"]{color:var(--teal)}
nav.bottom button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--teal)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font:700 10.5px/18px var(--f-mono);text-align:center}

/* module player bottom bar */
.stepbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.stepbar .row{max-width:760px;margin-inline:auto;display:flex;align-items:center;gap:10px}
.stepbar .count{flex:1;text-align:center;font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}

/* ===== Buttons ===== */
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--teal);color:var(--teal-ink);border-color:transparent}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.chipbtn{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);font-weight:500;font-size:14px;line-height:1.25;text-align:left}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 0 var(--line2)}

/* ===== Home ===== */
.hero{display:grid;gap:14px;margin-bottom:22px}
.hero h1{font-size:clamp(28px,7.4vw,40px);font-weight:800}
.hero h1 .ch{display:block;font:600 12px var(--f-mono);letter-spacing:.14em;color:var(--teal);text-transform:uppercase;margin-bottom:8px}
.hero p{color:var(--text2);max-width:58ch}
.monitor{border-radius:18px;background:#050d0f;border:1px solid #17302f;padding:14px 14px 10px;color:#d7f3ee;position:relative;overflow:hidden}
.monitor .chs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.monitor .ch{display:flex;flex-direction:column;gap:2px;min-width:0}
.monitor .ch small{font:600 10.5px var(--f-mono);letter-spacing:.14em;opacity:.8}
.monitor .ch b{font:600 clamp(24px,7vw,32px)/1 var(--f-mono);font-variant-numeric:tabular-nums}
.monitor .ch span{font:500 11px var(--f-body);opacity:.65}
.monitor .c1{color:#f3b746}.monitor .c2{color:#2fd3bf}.monitor .c3{color:#48c9ea}
.monitor svg.ecg{display:block;width:100%;height:46px;margin-top:8px}
.monitor svg.ecg path{fill:none;stroke:#2fd3bf;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(47,211,191,.6))}
.monitor svg.ecg path.sweep{stroke-dasharray:900;stroke-dashoffset:900;animation:sweep 4.5s linear infinite}
@keyframes sweep{to{stroke-dashoffset:0}}
.resume{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--teal);color:var(--teal-ink);border:0;text-align:left;width:100%}
.resume .t{flex:1;min-width:0}
.resume b{display:block;font:700 16px/1.25 var(--f-display)}
.resume span{font-size:13px;opacity:.85}
.resume svg{width:26px;height:26px;flex:none}

.sect{margin-top:26px;display:grid;gap:12px}
.sect > header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect h2{font-size:21px;font-weight:700}

.mods{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.mod .num{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:700 19px var(--f-mono);background:var(--surface3);color:var(--text2)}
.mod.ready .num{background:var(--teal-soft);color:var(--teal)}
.mod h3{font-size:16.5px;font-weight:700}
.mod .sub{font-size:13px;color:var(--muted);margin-top:2px}
.mod .arsub{font:500 12.5px var(--f-ar);color:var(--muted)}
.mod[disabled]{opacity:.62;cursor:default}
.mod .pill{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--surface3);color:var(--muted);white-space:nowrap}
.ring{width:40px;height:40px}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:var(--surface3)}
.ring .fgc{stroke:var(--teal);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font:600 10px var(--f-mono);fill:var(--text2)}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tool{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:96px;position:relative}
.tool svg{width:24px;height:24px;color:var(--teal)}
.tool b{font:700 14.5px/1.25 var(--f-display)}
.tool span{font-size:12.5px;color:var(--muted);line-height:1.35}
.tool .soon{position:absolute;top:10px;right:10px;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:3px 7px}
.tool[data-soon]{opacity:.7}

/* ===== Module player ===== */
.step{display:grid;gap:16px;animation:rise .28s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.step .kind{display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--text2);background:var(--surface2)}
.tag.teach{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,transparent);background:var(--teal-soft)}
.tag.check{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent);background:var(--amber-soft)}
.tag.play{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,transparent);background:var(--cyan-soft)}
.step h2{font-size:clamp(23px,6vw,30px);font-weight:750}
.lede{font-size:16.5px;line-height:1.65;color:var(--text);max-width:62ch}
.lede + .lede{margin-top:10px}

.predict{border:1px dashed var(--line2);border-radius:14px;padding:14px 16px;background:var(--surface);display:grid;gap:10px}
.predict .q{font-weight:600}
.predict .q::before{content:"Think first";display:block;font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.predict .a{color:var(--text2);font-size:14.5px}

.callout{border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.55;display:grid;gap:4px}
.callout .h{font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.callout.flag{background:var(--coral-soft);border:1px solid color-mix(in srgb,var(--coral) 35%,transparent)}
.callout.flag .h{color:var(--coral)}
.callout.beyond{border:1px dashed var(--line2);background:transparent;color:var(--text2)}
.callout.beyond .h{color:var(--muted)}
.callout.why{background:var(--teal-soft);border:1px solid color-mix(in srgb,var(--teal) 30%,transparent)}
.callout.why .h{color:var(--teal)}
.callout.hook{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.callout.hook .h{color:var(--amber)}
.src{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}

/* explain differently */
.xd{display:flex;flex-wrap:wrap;gap:8px}
.xd .chipbtn{font-size:13px;min-height:40px;padding:6px 12px}
.xdout{border:1px solid var(--line2);border-radius:14px;padding:12px 14px;background:var(--surface);font-size:14.5px;white-space:pre-wrap;line-height:1.6}
.xdout.ar{white-space:pre-wrap}

/* ===== Figures ===== */
figure{margin:0}
.fig{position:relative;background:var(--fig-bg);border-radius:14px;overflow:hidden;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.fig img{display:block;width:100%;height:auto;max-width:100%}
.fig .zoomer{position:absolute;right:8px;top:8px;z-index:4;width:38px;height:38px;border-radius:10px;border:0;background:var(--pin-bg);color:var(--pin-text);display:grid;place-items:center}
.fig .zoomer svg{width:18px;height:18px}
figcaption{font-size:13.5px;color:var(--text2);padding:10px 2px 0;line-height:1.5}
figcaption b{color:var(--teal);font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:2px}
.pin{position:absolute;transform:translate(-50%,-50%);z-index:2;border:0;background:var(--pin-bg);color:var(--pin-text);font:600 clamp(8.5px,2.35vw,12.5px)/1.15 var(--f-body);padding:.28em .5em;border-radius:6px;white-space:nowrap;pointer-events:auto}
.pin.ar{font-family:var(--f-ar);font-weight:600}
.pin.dot{width:clamp(18px,4.6vw,26px);height:clamp(18px,4.6vw,26px);padding:0;border-radius:50%;display:grid;place-items:center;background:#0b2a2f;color:#fff;border:2px solid #fff;box-shadow:0 0 0 2px rgba(11,42,47,.5);font:700 clamp(9px,2.3vw,12px) var(--f-mono)}
.pin.dot.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(72,201,234,.35)}}
.pin.ok{background:var(--teal);color:#032621}
.pin.dot.ok{background:#12b39f;border-color:#fff}
.pin.bad{background:#ff6f61 !important;animation:shake .35s ease}
@keyframes shake{25%{transform:translate(calc(-50% - 4px),-50%)}75%{transform:translate(calc(-50% + 4px),-50%)}}
.fig .drop{position:absolute;z-index:3;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9fbff,#48c9ea 55%,#0a7699);box-shadow:0 0 0 3px rgba(72,201,234,.35),0 0 14px rgba(72,201,234,.9);pointer-events:none}
.figwrap.zoomed{overflow-x:auto;border-radius:14px}
.figwrap.zoomed .fig{width:170%;max-width:none}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(3,9,11,.985);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.lb .bar{display:flex;align-items:center;gap:8px;color:#e2eef0}
.lb .bar b{flex:1;font:700 15px var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .bar .ibtn{color:#e2eef0}
.lb .body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding-block:8px;touch-action:pan-x pan-y pinch-zoom}
.lb .body .fig{width:100%;max-width:1100px}
.lb .body.big .fig{width:190%;max-width:none}
.lb .cap{color:#c6d8db;font-size:14px;max-width:760px;margin-inline:auto;padding:6px 8px}

/* ===== Interactives ===== */
.ix{display:grid;gap:12px}
.ix .prompt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ix .prompt .find{flex:1;min-width:0;font-weight:600}
.ix .prompt .find small{display:block;font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:2px}
.ix .prompt .find span{font:700 18px/1.25 var(--f-display)}
.ix .score{font:600 12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tray .chipbtn.sel{border-color:var(--cyan);background:var(--cyan-soft);color:var(--text)}
.tray .chipbtn.bad{border-color:var(--coral);background:var(--coral-soft);animation:shake2 .35s ease}
.tray .chipbtn.done{opacity:.35;pointer-events:none;text-decoration:line-through}
@keyframes shake2{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.seq{display:grid;gap:6px;counter-reset:s;margin:0;padding:0}
.seq li{list-style:none;display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px;border-radius:12px;border:1px dashed var(--line2);color:var(--muted);font-size:14.5px}
.seq li::before{counter-increment:s;content:counter(s);width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--f-mono);background:var(--surface3);color:var(--text2)}
.seq li.on{border-style:solid;border-color:color-mix(in srgb,var(--teal) 50%,transparent);background:var(--teal-soft);color:var(--text);font-weight:600}
.seq li.on::before{background:var(--teal);color:var(--teal-ink)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.bin{border:1.5px dashed var(--line2);border-radius:14px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:8px;background:var(--surface);text-align:left}
.bin > b{font:700 14px var(--f-display)}
.bin > small{color:var(--muted);font-size:12px;margin-top:-6px}
.bin.target{border-color:var(--cyan);background:var(--cyan-soft)}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin .in span{font-size:12.5px;padding:4px 8px;border-radius:8px;background:var(--teal-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--teal) 35%,transparent)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:8px;align-content:start}
.match button{min-height:56px;padding:8px 10px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);text-align:left;font-size:13.5px;line-height:1.3}
.match button.sel{border-color:var(--cyan);background:var(--cyan-soft)}
.match button.ok{border-color:color-mix(in srgb,var(--teal) 55%,transparent);background:var(--teal-soft);opacity:.75;pointer-events:none}
.match button.bad{border-color:var(--coral);background:var(--coral-soft);animation:shake2 .35s ease}
.match button .pair{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--teal);color:var(--teal-ink);font:700 11px var(--f-mono);margin-right:6px;vertical-align:-4px}
.win{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--teal-soft);border:1px solid color-mix(in srgb,var(--teal) 35%,transparent)}
.win b{font:700 16px var(--f-display)}
.win .grow{flex:1}

/* ===== Questions ===== */
.q{display:grid;gap:14px}
.q .stem{font:600 17.5px/1.45 var(--f-body)}
.q .lv{display:flex;gap:6px;flex-wrap:wrap}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:54px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);text-align:left;font-size:15px;line-height:1.4;transition:border-color .15s,background .15s}
.opt .L{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:600 12.5px var(--f-mono);background:var(--surface3);color:var(--text2);margin-top:-1px}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.right .L{background:var(--teal);color:var(--teal-ink)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.opt.wrong .L{background:var(--coral);color:#fff}
.opt.dim{opacity:.55}
.verdict{display:flex;align-items:center;gap:10px;font:700 17px var(--f-display)}
.verdict.good{color:var(--teal)}
.verdict.bad{color:var(--coral)}
.verdict svg{width:24px;height:24px}
.sa textarea{width:100%;min-height:120px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);padding:12px 14px;font-size:15px;line-height:1.5;resize:vertical}
.sa .row{display:flex;gap:8px;flex-wrap:wrap}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:44px;font-size:14.5px}
.checks input{width:20px;height:20px;accent-color:var(--teal);flex:none;margin-top:1px}
.checks label.got{border-color:color-mix(in srgb,var(--teal) 45%,transparent)}
.checks label.miss{border-color:color-mix(in srgb,var(--coral) 45%,transparent)}

/* ===== Recall / hooks / done ===== */
.recall{display:grid;gap:10px}
.rc{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;display:grid;gap:8px}
.rc .p{font-weight:600}
.rc textarea{width:100%;min-height:64px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);padding:8px 10px;font-size:14.5px;resize:vertical}
.rc .ans{font-size:14.5px;color:var(--text2);padding:10px 12px;border-radius:10px;background:var(--surface2)}
.rc .row{display:flex;gap:8px;flex-wrap:wrap}
.hooks{display:grid;gap:10px}
.hk{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.hk .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber);font:700 15px var(--f-mono)}
.hk b{display:block;font:700 15.5px/1.35 var(--f-display);margin-bottom:3px}
.hk p{font-size:14px;color:var(--text2)}
.done{text-align:center;display:grid;gap:12px;justify-items:center;padding-top:12px}
.done .big{font:800 clamp(40px,12vw,64px)/1 var(--f-mono);color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats div{border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:12px 6px;display:grid;gap:2px}
.stats b{font:600 22px var(--f-mono)}
.stats span{font-size:11.5px;color:var(--muted)}

/* ===== Visual blocks (in cards) ===== */
.viz{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:14px}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.job{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.job svg{width:34px;height:34px}
.job b{font:700 14px/1.3 var(--f-display)}
.job span{font-size:12.5px;color:var(--muted);line-height:1.35}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 8px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:grid;gap:4px;align-content:start}
.stat b{font:600 clamp(20px,6vw,28px)/1 var(--f-mono);color:var(--cyan)}
.stat span{font-size:12px;color:var(--text2);line-height:1.35}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{padding:6px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line2);font-size:13px;font-weight:600}
.flow i{font-style:normal;color:var(--teal);font-weight:700}

.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h) + 6px);z-index:5}

.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.results{display:grid;gap:8px;margin-top:14px}
.res{display:grid;gap:4px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.res .where{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.res b{font:700 15px/1.3 var(--f-display)}
.res p{font-size:13.5px;color:var(--text2);line-height:1.45}
.res mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

.fc{perspective:1200px}
.fc .inner{position:relative;min-height:280px;border-radius:20px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flipped .inner{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;border-radius:20px;border:1px solid var(--line2);background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.fc .back{transform:rotateY(180deg);background:var(--surface2)}
.fc .face .t{font:700 20px/1.35 var(--f-display)}
.fc .face .b{font-size:16px;line-height:1.6}
.fc .meta{margin-top:auto;display:flex;justify-content:space-between;font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn.again{border-color:color-mix(in srgb,var(--coral) 55%,transparent);color:var(--coral);background:var(--coral-soft)}
.btn.got{border-color:color-mix(in srgb,var(--teal) 55%,transparent);color:var(--teal);background:var(--teal-soft)}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.boxes div{border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:10px 4px;text-align:center;display:grid;gap:2px}
.boxes b{font:600 18px var(--f-mono)}
.boxes span{font:600 9.5px var(--f-mono);color:var(--muted);letter-spacing:.06em}

.list{display:grid;gap:8px}
.set{display:grid;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.set h3{font-size:16px}
.set p{font-size:13.5px;color:var(--muted)}
.btn.danger{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 45%,transparent)}

.arwrap{display:grid;gap:14px}
.arwrap .blk{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:grid;gap:8px}
.arwrap h2,.arwrap h3{font-family:var(--f-ar);font-weight:600}
.arwrap h3{font-size:17px;color:var(--teal)}
.arwrap p,.arwrap li{font-size:15.5px}
.arwrap ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.arwrap .en{font-family:var(--f-body);direction:ltr;unicode-bidi:isolate;font-weight:500;color:var(--teal)}

}

CONTENT.m1 = {
  intro: 'Everything later in this chapter (stones, AKI, dialysis, torsion) is a problem somewhere along one route: blood in, urine out. Learn the route once here and every later module will make sense.',
  steps: [
    /* --- 1. What the system does --- */
    { t: 'card', id: 'm1c1', title: 'Four jobs of the urinary system', src: 'A2, B2',
      predict: { q: 'The urinary system has four jobs. How many can you name before reading?', a: 'Filter wastes · electrolytes · acid-base · fluid volume & blood pressure' },
      body: ['The urinary system is the body’s <k>filter and balancer</k>. It does four jobs: it <k>filters blood and removes metabolic wastes</k>, <k>manages electrolyte concentrations</k>, <k>maintains acid-base balance</k> in the bloodstream, and <k>regulates fluid volume and blood pressure</k>.',
        'Why this matters on a call: when the kidneys fail, all four jobs fail together. That is why an untreated acute kidney injury leads to <k>volume overload</k>, <k>hyperkalemia</k>, <k>uremia</k> and <k>metabolic acidosis</k>.'],
      viz: 'jobs' },
    { t: 'ix', id: 'm1x1', kind: 'match', title: 'What breaks when each job fails?',
      intro: 'Match each kidney job with the AKI complication that appears when that job fails.',
      spec: { prompt: 'Tap a job, then the complication it prevents', pairs: [
        ['Filters blood, removes metabolic wastes', 'Nitrogenous wastes build up (uremia)'],
        ['Manages electrolyte concentrations', 'Potassium climbs (hyperkalemia)'],
        ['Maintains acid-base balance', 'Acid builds up (metabolic acidosis)'],
        ['Regulates fluid volume and blood pressure', 'Fluid is retained (volume overload, edema)'],
      ] } },
    { t: 'q', q: { id: 'm1q1', lv: 'R', src: 'A2, B2', stem: 'Which of the following is <b>NOT</b> a function of the urinary system in your notes?',
      opts: ['Storing bile for fat digestion', 'Maintaining acid-base balance in the blood', 'Regulating fluid volume and blood pressure', 'Managing concentrations of electrolytes'],
      why: 'Bile storage belongs to the gallbladder. The urinary system’s four jobs are: filter blood and remove metabolic wastes, manage electrolytes, maintain acid-base balance, and regulate fluid volume and blood pressure.',
      trap: [2, 'Blood pressure sounds like a heart job, but your notes list “regulates fluid volume and blood pressure” as a urinary function.'] } },
    { t: 'q', q: { id: 'm1q2', lv: 'A', src: 'A2, A39', stem: 'A patient with untreated acute kidney injury now has a dangerously high potassium level. Which kidney job has failed?',
      opts: ['Managing electrolyte concentrations', 'Maintaining acid-base balance', 'Regulating fluid volume', 'Removing metabolic wastes'],
      why: 'Potassium is an electrolyte. Hyperkalemia means the kidney can no longer manage electrolyte concentrations.',
      trap: [1, 'Acid-base failure causes metabolic acidosis. It often appears alongside hyperkalemia in AKI, but it is a different job.'] } },

    /* --- 2. Disorders and numbers --- */
    { t: 'card', id: 'm1c2', title: 'Four kinds of renal disorder', src: 'A3, B3',
      body: ['Your notes list four types of renal disorder: <k>kidney failure</k> (the most common), <k>nephrolithiasis</k>, <k>urinary tract infections (UTIs)</k>, and <k>noncancerous enlargement of the prostate</k>.',
        'Nephrolithiasis has three names you must recognise: <em>nephrolithiasis = kidney stones = renal calculi</em>. UTIs affect about <n>50%</n> of all women. The prostate problem is <k>benign prostatic hypertrophy (BPH)</k>, covered in Module 8.'],
      flag: 'File A says “kidney failure (most common)”. File B says “kidney disease” and adds “UTIs 50% of all women”. Both are kept here.' },
    { t: 'card', id: 'm1c3', title: 'Chronic kidney disease in numbers', src: 'B4',
      predict: { q: 'Guess: what share of adults over 70 have CKD?', a: 'More than half.' },
      body: ['CKD affects more than <n>5–10%</n> of the world’s population and <k>more than half of adults older than 70</k>. In <k>Saudi Arabia</k> the figure is <n>6.5%</n>.',
        'What this means in the field: an older patient you see for a fall or chest pain may also have CKD, and that shapes how you think about their fluids, potassium and heart. CKD itself is Module 6.'],
      viz: 'ckd' },
    { t: 'q', q: { id: 'm1q3', lv: 'R', src: 'A3, B3', stem: '“Nephrolithiasis” is another name for:',
      opts: ['Kidney stones', 'A kidney infection', 'Kidney failure', 'Kidney swelling from backed-up urine'],
      why: 'Nephrolithiasis = kidney stones = renal calculi. “Lith” means stone.',
      trap: [3, 'That is hydronephrosis: swelling caused when a stone blocks urine flow. It is a result of the stone, not the stone itself.'] } },
    { t: 'q', q: { id: 'm1q4', lv: 'R', src: 'A3', stem: 'According to your notes, which renal disorder is the <b>most common</b>?',

      why: 'File A labels kidney failure as the most common type of renal disorder.',

    /* --- 3. Four organs --- */

      cap: 'Follow the ureters: two of them, one from each kidney, both ending in the single bladder. The urethra is the only exit.',
      body: ['Urine is made and moved by four organs in a line: <k>kidneys</k> → <k>ureters</k> → <k>urinary bladder</k> → <k>urethra</k>. The kidneys filter blood and make urine, the ureters carry it down, the bladder stores it, and the urethra carries it out.',

    { t: 'ix', id: 'm1x2', kind: 'label', title: 'Label the urinary system', intro: 'Tap the dot that matches each name.', spec: { fig: 'urinary_system' } },

    { t: 'q', q: { id: 'm1q9', lv: 'R', src: 'A5, B6', stem: 'The three internal regions of the kidney are the:',

    { t: 'q', q: { id: 'm1q11', lv: 'U', src: 'B9 (figure)', stem: 'On the kidney figure, the renal artery, renal vein and ureter all pass through the:',

    /* --- 6. Nephron --- */
    { t: 'card', id: 'm1c7', title: 'The nephron: where urine is made', src: 'A6, B7', fig: 'nephron',
      cap: 'The pale band at the top is cortex and the orange band is medulla. See how the loop of Henle dives down into the medulla.',
      body: ['The <k>nephron</k> is the <k>structural and functional unit</k> of the kidney. It is the part that actually <k>forms urine</k>. Your notes place the nephrons <k>in the cortex</k>.',
        'Look at the figure, though: the filter and the twisted tubules sit in the cortex, while the loop of Henle dips into the medulla. On the exam, answer “cortex”, as your notes say.'],
      flag: 'Standard anatomy: nephrons span the cortex and the medulla, because the loop of Henle reaches into the medulla. Your notes say “in the cortex”. Use the notes’ wording on the exam.' },
    { t: 'card', id: 'm1c8', title: 'Five nephron parts, in order', src: 'A7, B8', fig: 'nephron', figLabels: ['glomerulus', 'bowman', 'pct', 'loop', 'dct', 'cd'],
      cap: 'Trace it with your finger: knot → cup → first coil → U-shaped loop → second coil → the long collecting duct.',
      predict: { q: 'Name the five nephron parts in the order fluid passes through them.', a: 'Glomerulus → Bowman capsule → PCT → loop of Henle → DCT.' },
      body: ['Your notes list five parts, in the order fluid passes through them: <k>glomerulus</k> → <k>glomerular (Bowman) capsule</k> → <k>proximal convoluted tubule (PCT)</k> → <k>loop of Henle</k> → <k>distal convoluted tubule (DCT)</k>.',
        'After the DCT, fluid drains into a <k>collecting duct</k>. “Proximal” means near the capsule and “distal” means far from it, so the PCT always comes first.'],
      hook: '<b>G</b>ood <b>B</b>oys <b>P</b>ee <b>L</b>ots <b>D</b>aily: Glomerulus, Bowman, PCT, Loop, DCT.' },
    { t: 'ix', id: 'm1x5', kind: 'order', title: 'Follow the filtrate', intro: 'Tap the parts in the order fluid passes through them. The drop shows where the fluid is.',
      spec: { fig: 'nephron', path: 'filtrate', items: ['glomerulus', 'bowman', 'pct', 'loop', 'dct', 'cd'], promptSmall: 'Filtrate route', prompt: 'Where does the fluid go next?', endText: 'From the collecting duct the fluid leaves as urine, heading for the papilla and the calyces.' } },
    { t: 'card', id: 'm1c9', title: 'The blood side of the nephron', src: 'A6, B10–B12 (figures)', fig: 'nephron', figLabels: ['afferent', 'efferent', 'vasa', 'macula', 'desc', 'asc', 'cmj'],
      cap: 'Red = blood arriving, blue = blood leaving. The vasa recta hug the loop of Henle like a ladder.',
      body: ['Blood reaches the glomerulus through the <k>afferent arteriole</k> and leaves through the <k>efferent arteriole</k>. Long capillaries called <k>vasa recta</k> run beside the loop of Henle.',
        'The loop has a <k>descending limb</k> going down and an <k>ascending limb</k> coming back up. Where the DCT touches the arterioles sits the <k>macula densa</k>.'],
      hook: '<b>A</b>fferent <b>A</b>rrives, <b>E</b>fferent <b>E</b>xits.',
      beyond: 'These structures are labelled on your slides but not described. The short roles given here are standard anatomy.' },
    { t: 'ix', id: 'm1x6', kind: 'label', title: 'Label the nephron', intro: 'Find each part on the nephron and its blood supply.', spec: { fig: 'nephron' } },
    { t: 'q', q: { id: 'm1q12', lv: 'R', src: 'A6, B7', stem: 'The structural and functional unit of the kidney that forms urine is the:',
      opts: ['Nephron', 'Renal pyramid', 'Renal lobe', 'Glomerulus'],
      why: 'Your notes: nephrons are the structural and functional units that form urine.',
      trap: [3, 'The glomerulus is only one part of the nephron: the filter at its start.'] } },
    { t: 'q', q: { id: 'm1q13', lv: 'R', src: 'A6, B7', stem: 'According to your notes, the nephrons are located in the:',
      opts: ['Cortex', 'Medulla', 'Renal pelvis', 'Renal sinus'],
      why: 'Your notes state: “Nephrons: in the cortex”.',
      trap: [1, 'The loop of Henle does dip into the medulla, but the notes’ answer is “cortex”.'],
      flag: 'Standard anatomy says nephrons span cortex and medulla. The notes’ wording is used here.' } },
    { t: 'q', q: { id: 'm1q14', lv: 'U', src: 'A7, B8', stem: 'Which sequence lists the nephron parts in the order fluid passes through them?',
      opts: ['Glomerulus → Bowman capsule → PCT → loop of Henle → DCT', 'Bowman capsule → glomerulus → PCT → DCT → loop of Henle', 'Glomerulus → PCT → Bowman capsule → loop of Henle → DCT', 'Glomerulus → Bowman capsule → DCT → loop of Henle → PCT'],
      why: 'Blood is filtered in the glomerulus, the filtrate is caught by Bowman capsule, then passes the PCT, the loop of Henle and the DCT.',
      trap: [3, 'Proximal (near) comes before distal (far). The PCT is first, the DCT is last.'] } },
    { t: 'q', q: { id: 'm1q15', lv: 'U', src: 'A7, B8', stem: 'Fluid filtered out of the glomerulus is first caught by the:',
      opts: ['Glomerular (Bowman) capsule', 'Proximal convoluted tubule', 'Loop of Henle', 'Collecting duct'],
      why: 'Bowman capsule is the cup wrapped around the glomerulus; it is the second part in the list.',

    { t: 'q', q: { id: 'm1q16', lv: 'R', src: 'A6, B10 (figures)', stem: 'Which vessel carries blood <b>into</b> the glomerulus?',
      opts: ['Afferent arteriole', 'Efferent arteriole', 'Vasa recta', 'Renal vein'],

    { t: 'q', q: { id: 'm1q17', lv: 'R', src: 'A7, B8', stem: 'Which of these is <b>NOT</b> one of the five nephron parts listed in your notes?',
      opts: ['Renal papilla', 'Loop of Henle', 'Distal convoluted tubule', 'Glomerular (Bowman) capsule'],
      why: 'The five parts are the glomerulus, Bowman capsule, PCT, loop of Henle and DCT. The renal papilla is the tip of a pyramid.',
      trap: [1, 'The loop of Henle reaches into the medulla, which tempts some students to drop it, but it is one of the five parts.'] } },

    /* --- 7. Urine drainage path --- */
    { t: 'card', id: 'm1c10', title: 'The urine drainage route', src: 'B9', fig: 'kidney_map', figLabels: ['p_cd', 'p_pd', 'p_mi', 'p_ma', 'p_pe', 'p_ur', 'p_bl'],
      cap: 'The column on the right is the route in order, top to bottom. Each arrow is one step downstream.',
      predict: { q: 'Urine has just left the collecting duct. Where does it go next, all the way to the bladder?', a: 'Papillary duct → minor calyx → major calyx → renal pelvis → ureter → bladder.' },
      body: ['Once urine leaves the nephron it follows a fixed route: <k>collecting duct</k> → <k>papillary duct</k> → <k>minor calyx</k> → <k>major calyx</k> → <k>renal pelvis</k> → <k>ureter</k> → <k>urinary bladder</k>.',
        'Why it matters: a blockage anywhere on this route backs urine up behind it. That is the idea behind a stone causing <k>hydronephrosis</k> (Module 4) and <k>postrenal AKI</k> (Module 5).'],
      hook: '“<b>C</b>an <b>P</b>eople <b>M</b>ind <b>M</b>y <b>P</b>rivate <b>U</b>rinary <b>B</b>usiness?” Collecting, Papillary, Minor, Major, Pelvis, Ureter, Bladder.' },
    { t: 'ix', id: 'm1x7', kind: 'order', title: 'Drip the drop to the bladder', intro: 'Tap each station in order. The drop travels the real route on the kidney.',
      spec: { fig: 'kidney_map', path: 'urine', items: ['p_cd', 'p_pd', 'p_mi', 'p_ma', 'p_pe', 'p_ur', 'p_bl'], promptSmall: 'Urine drainage', prompt: 'Next station?', endText: 'From the bladder, urine leaves through the urethra.' } },
    { t: 'q', q: { id: 'm1q18', lv: 'U', src: 'B9', stem: 'On the drainage route, urine leaving a <b>minor calyx</b> flows next into the:',
      opts: ['Major calyx', 'Renal pelvis', 'Papillary duct', 'Ureter'],
      why: 'Minor calyces merge into a major calyx; major calyces empty into the pelvis.',
      trap: [1, 'The pelvis comes one step later, after the major calyx.'] } },
    { t: 'q', q: { id: 'm1q19', lv: 'A', src: 'B9, A33', stem: 'A stone is stuck in the left ureter. Based on the drainage route, where does urine back up?',
      opts: ['Into the left renal pelvis and calyces', 'Into the urinary bladder', 'Into the right kidney', 'Into the urethra'],
      why: 'Urine backs up upstream of the block: the ureter above the stone, the pelvis and the calyces. Your stone figure shows this as hydronephrosis and hydroureter.',
      trap: [1, 'The bladder is downstream of the stone, so it receives less urine from that side, not more.'] } },

    { t: 'card', id: 'm1c11', title: 'The male system shares the urethra', src: 'A8–A9, B14–B15', fig: 'male_gu',

  arabic: `
<div class="blk"><h3>الفكرة الكبيرة</h3><p>كل أمراض هذا الفصل هي مشكلة في مكان ما على طريق واحد: الدم يدخل الكلية، والبول يخرج. إذا حفظت الطريق، فهمت كل شيء بعده.</p></div>
<div class="blk"><h3>وظائف الجهاز البولي (٤)</h3><ul>
<li>ينقّي الدم ويزيل الفضلات الأيضية <span class="en">filters blood, removes metabolic wastes</span></li>
<li>ينظّم تركيز الأملاح <span class="en">electrolytes</span></li>
<li>يحافظ على التوازن الحمضي القاعدي <span class="en">acid-base balance</span></li>
<li>ينظّم حجم السوائل وضغط الدم <span class="en">fluid volume & blood pressure</span></li></ul>
<p>إذا فشلت الكلية تفشل الأربع معاً، ولهذا تسبب <span class="en">AKI</span> غير المعالجة: <span class="en">volume overload, hyperkalemia, uremia, metabolic acidosis</span>.</p></div>
<div class="blk"><h3>أنواع الاضطرابات الكلوية</h3><ul>
<li><span class="en">Kidney failure</span>: الأكثر شيوعاً (الملف A)</li>
<li><span class="en">Nephrolithiasis</span> = <span class="en">kidney stones</span> = <span class="en">renal calculi</span> (ثلاثة أسماء لمرض واحد)</li>
<li><span class="en">UTIs</span>: تصيب حوالي ٥٠٪ من النساء</li>
<li>تضخم البروستاتا غير السرطاني <span class="en">BPH</span></li></ul></div>
<div class="blk"><h3>أرقام المرض الكلوي المزمن CKD</h3><ul>
<li>أكثر من ٥–١٠٪ من سكان العالم</li><li>أكثر من نصف البالغين فوق ٧٠ سنة</li><li>٦٫٥٪ في السعودية</li></ul></div>
<div class="blk"><h3>التشريح</h3><ul>
<li>الأعضاء الأربعة بالترتيب: <span class="en">kidneys → ureters → urinary bladder → urethra</span></li>
<li>الإحليل <span class="en">urethra</span> أقصر عند الإناث</li>
<li>مناطق الكلية الثلاث من الخارج للداخل: <span class="en">cortex → medulla → renal pelvis</span></li>
<li>حصى الكلى تبدأ في <span class="en">renal pelvis</span></li>

  if (!S.set.sound) return;
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    let t = _ac.currentTime;
    freqs.forEach(f => {
      const o = _ac.createOscillator(), g = _ac.createGain();

    });

/* Tap-to-label: find each structure on the figure */
IX.label = function (spec, host, done) {
  const f = FIGS[spec.fig];
  const targets = (f.labels || []).filter(l => !l.hide && (spec.only ? spec.only.includes(l.id) : !l.path));
  let order, k, errors, found;
  const root = el(`<div class="ix">
    <div class="prompt"><div class="find"><small>Find on the figure</small><span></span><div class="ar muted" style="font-size:13px;text-align:left;direction:rtl"></div></div>
      <span class="score"></span><button class="btn small ghost" data-hint>Show me</button></div>
    <div class="figslot"></div><ol class="legend" aria-label="Found so far"></ol><div class="after"></div></div>`);
  host.appendChild(root);
  const fig = figureEl(spec.fig, { labels: false });
  $('.figslot', root).appendChild(zoomable(fig));
  const dots = {};
  targets.forEach(l => {
    const [x, y] = pinCenter(l);
    const d = el(`<span class="pin dot" data-id="${l.id}" style="left:${x}%;top:${y}%" aria-hidden="true"></span>`);
    fig.appendChild(d); dots[l.id] = d;
  });
  function start() {
    order = shuffle(targets); k = 0; errors = 0; found = new Set();
    targets.forEach(l => { const d = dots[l.id]; d.className = 'pin dot'; d.textContent = ''; const [x] = pinCenter(l); d.style.left = x + '%'; d.style.transform = ''; });
    $('.after', root).innerHTML = ''; $('.legend', root).innerHTML = ''; $('[data-hint]', root).hidden = false;
    ask();
  }
  function ask() {
    const t = order[k];
    $('.find span', root).textContent = t.en;
    $('.find .ar', root).textContent = t.ar;
    $('.score', root).textContent = `${k}/${order.length}`;
  }
  function reveal(l, cls) {
    const d = dots[l.id];
    if (f.dense) {
      d.className = 'pin dot ok'; d.textContent = found.size;
      $('.legend', root).appendChild(el(`<li><b>${found.size}</b>${esc(S.set.arLabels ? l.ar : l.en)}</li>`));
      return;
    }
    d.className = 'pin ' + cls;
    const a = l.box[0] < 12 ? 'l' : l.box[2] > 88 ? 'r' : 'c';
    if (a === 'l') { d.style.left = l.box[0] + '%'; d.style.transform = 'translate(0,-50%)'; }
    else if (a === 'r') { d.style.left = l.box[2] + '%'; d.style.transform = 'translate(-100%,-50%)'; }
    d.textContent = S.set.arLabels ? l.ar : (l.short || l.en);
  }
  fig.addEventListener('click', e => {
    if (k >= order.length) return;
    const r = fig.getBoundingClientRect();
    let best = null, bd = 1e9;
    targets.forEach(l => {
      if (found.has(l.id)) return;
      const [x, y] = pinCenter(l);
      const dx = r.left + r.width * x / 100 - e.clientX, dy = r.top + r.height * y / 100 - e.clientY;
      const dd = Math.hypot(dx, dy);
      if (dd < bd) { bd = dd; best = l; }
    });
    if (!best || bd > 46) return;
    const t = order[k];
    if (best.id === t.id) {
      sfx.ok(); found.add(t.id); reveal(t, 'ok'); k++;
      if (k === order.length) finish(); else ask();
    } else {
      sfx.bad(); errors++;
      const d = dots[best.id];
      d.classList.add('bad'); d.textContent = best.short || best.en; d.classList.remove('dot');
      setTimeout(() => { if (!found.has(best.id)) { d.className = 'pin dot'; d.textContent = ''; } }, 1100);
    }
  });
  $('[data-hint]', root).onclick = () => {
    if (k >= order.length) return;
    errors++;
    const d = dots[order[k].id]; d.classList.add('pulse');
    setTimeout(() => d.classList.remove('pulse'), 2400);
  };

    sfx.win();
    $('.find span', root).textContent = 'All found';
    $('.find .ar', root).textContent = '';
    $('.score', root).textContent = `${order.length}/${order.length}`;
    $('[data-hint]', root).hidden = true;
    const msg = errors ? `${order.length} structures found · ${errors} miss${errors > 1 ? 'es' : ''}` : `${order.length}/${order.length} with no misses`;
    $('.after', root).appendChild(winBar(msg, start));
    done && done({ total: order.length, errors });
  }
  start();
};

/* ===== views ===== */
const DAY = 86400000;
const INTV = [1, 3, 7, 16, 35];
const SESSION = { miss: {} };

/* ---------- derived data ---------- */
const QINDEX = {}, FINDEX = {};
function indexContent() {
  MODULES.forEach(m => {
    const c = CONTENT[m.id]; if (!c) return;
    c.steps.forEach((s, i) => { if (s.t === 'q') QINDEX[s.q.id] = { q: s.q, mid: m.id, i }; });
    (c.flash || []).forEach(f => FINDEX[f.id] = Object.assign({ mid: m.id }, f));
  });
}
function ready(mid) { return !!CONTENT[mid]; }
function modById(mid) { return MODULES.find(m => m.id === mid); }

function flowOf(mid) {
  const c = CONTENT[mid];
  let st = c.steps.map((s, i) => Object.assign({ _i: i }, s));
  if (S.set.qmode === 'end') {
    const qs = st.filter(s => s.t === 'q');
    st = st.filter(s => s.t !== 'q');
    if (qs.length) st.push({ t: 'qhead', _i: -1 }, ...qs);
  }
  return [{ t: 'intro', _i: -1 }, ...st, { t: 'lockin', _i: -1 }, { t: 'recall', _i: -1 }, { t: 'hooks', _i: -1 }, { t: 'done', _i: -1 }];
}
function stepKey(s) { return s.t === 'q' ? s.q.id : s.id; }
function prog(mid) { return S.prog[mid] || (S.prog[mid] = { at: 0, seen: {}, ix: {}, done: false }); }
function modPct(mid) {
  if (!ready(mid)) return 0;
  const c = CONTENT[mid], p = S.prog[mid];
  if (!p) return 0;
  const keys = c.steps.map(stepKey);
  return pct(keys.filter(k => p.seen[k]).length, keys.length);
}
function accuracy() {
  let r = 0, t = 0;
  Object.values(S.qs).forEach(x => { t++; if (x.ok) r++; });
  return t ? pct(r, t) : null;
}

/* ---------- SRS ---------- */
function availableCards() {
  const out = [];
  MODULES.forEach(m => { if (S.started[m.id] && CONTENT[m.id]) (CONTENT[m.id].flash || []).forEach(f => out.push(FINDEX[f.id])); });
  return out;
}
function dueQueue() {
  const now = Date.now();
  const cards = availableCards();
  const lapsed = [], due = [], fresh = [];
  cards.forEach(c => {
    const s = S.srs[c.id];
    if (!s) fresh.push(c);
    else if (s.b === -1) lapsed.push(c);
    else if (s.due <= now) due.push(c);
  });
  due.sort((a, b) => S.srs[a.id].due - S.srs[b.id].due);
  return [...lapsed, ...due, ...fresh];
}
function gradeCard(id, ok) {
  const s = S.srs[id];
  if (ok) {
    const b = !s || s.b < 0 ? 0 : Math.min(s.b + 1, 4);
    S.srs[id] = { b, due: Date.now() + INTV[b] * DAY };
  } else {
    S.srs[id] = { b: -1, due: Date.now(), lapsed: true };
  }
  save();
}
function nextDueText() {
  const future = availableCards().map(c => S.srs[c.id]).filter(s => s && s.b >= 0).map(s => s.due);
  if (!future.length) return '';
  const d = Math.min(...future) - Date.now();
  if (d <= 0) return 'now';
  const h = Math.round(d / 3600000);
  return h < 24 ? `in ${Math.max(1, h)} h` : `in ${Math.round(d / DAY)} day${Math.round(d / DAY) > 1 ? 's' : ''}`;
}

/* ---------- router ---------- */
const R = { view: 'home', params: {}, stack: [] };
function go(view, params = {}, replace = false) {
  if (!replace) R.stack.push({ view: R.view, params: R.params });
  R.view = view; R.params = params;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
function back() {
  const p = R.stack.pop();
  if (p) { R.view = p.view; R.params = p.params; } else { R.view = 'home'; R.params = {}; }
  render();
  window.scrollTo(0, 0);
}

/* ---------- ECG strip for the home monitor ---------- */
function ecgPath(w = 600, h = 46, beats = 5) {
  const base = h * 0.62, seg = w / beats;
  let d = `M0 ${base}`;
  for (let i = 0; i < beats; i++) {
    const x = i * seg;
    d += ` L${x + seg * .18} ${base} Q${x + seg * .23} ${base - 6} ${x + seg * .28} ${base}`;
    d += ` L${x + seg * .36} ${base} L${x + seg * .39} ${base + 5} L${x + seg * .43} ${base - h * .55} L${x + seg * .47} ${base + 9} L${x + seg * .5} ${base}`;
    d += ` L${x + seg * .6} ${base} Q${x + seg * .69} ${base - 11} ${x + seg * .78} ${base} L${x + seg} ${base}`;
  }
  return d;
}

/* ---------- module player ---------- */
function openModule(mid, at) {
  if (!ready(mid)) return;
  S.started[mid] = true;
  const p = prog(mid);
  if (at != null) p.at = at;
  save();
  go('module', { mid });
}

VIEWS.module = (app, { mid }) => {
  const mod = modById(mid), c = CONTENT[mid], p = prog(mid);
  const flow = flowOf(mid);
  if (p.at >= flow.length) p.at = flow.length - 1;
  if (p.at < 0) p.at = 0;
  const step = flow[p.at];
  S.last = { mid }; save();
  const counts = { card: 0, ix: 0, q: 0 };
  c.steps.forEach(s => counts[s.t]++);
  const tb = topBar(mod.title, `Module ${mod.n} · ${stepLabel(step, flow, p.at)}`, { back: true, close: true, onBack: () => { R.stack = []; go('home', {}, true); }, progress: Math.round(100 * p.at / (flow.length - 1)) });
  const arb = el(`<button class="ibtn txt" aria-label="Arabic summary">ع</button>`);
  arb.onclick = () => go('arabic', { mid });
  $('.acts', tb).appendChild(arb);
  app.appendChild(tb);
  const m = mainEl(); app.appendChild(m);
  const wrap = el('<section class="step"></section>'); m.appendChild(wrap);

  let canGo = true;
  const bar = el(`<div class="stepbar"><div class="row">
    <button class="btn ghost small" data-prev aria-label="Previous step" ${p.at === 0 ? 'disabled' : ''}>${I.prev}</button>
    <span class="count">${p.at + 1} / ${flow.length}</span>
    <button class="btn primary" data-next>Continue ${I.next}</button></div></div>`);
  const nextBtn = $('[data-next]', bar);
  function setNext(label, enabled = true) { nextBtn.innerHTML = `${label} ${I.next}`; nextBtn.disabled = !enabled; canGo = enabled; }
  $('[data-prev]', bar).onclick = () => { p.at = Math.max(0, p.at - 1); save(); render(); window.scrollTo(0, 0); };
  nextBtn.onclick = () => {
    if (!canGo) return;
    const k = step.t === 'card' || step.t === 'ix' || step.t === 'q' ? stepKey(step) : null;
    if (k) p.seen[k] = 1;
    if (p.at < flow.length - 1) { p.at++; save(); render(); window.scrollTo(0, 0); }
    else { p.done = true; p.at = 0; save(); R.stack = []; go('home', {}, true); }
  };
  app.appendChild(bar);

  const R_ = STEP_RENDER[step.t];
  R_(wrap, step, { mid, mod, c, p, flow, setNext, counts });
};

function stepLabel(step, flow, at) {
  const names = { intro: 'Overview', card: 'Learn', ix: 'Interactive', q: 'Check yourself', qhead: 'Question round', lockin: 'Lock-in round', recall: 'Recall from memory', hooks: 'Memory hooks', done: 'Module complete' };
  return names[step.t] || '';
}

STEP_RENDER.lockin = (w, s, { mid, setNext }) => {
  const ids = new Set([...(SESSION.miss[mid] || [])]);
  Object.keys(S.mist).forEach(id => { if (QINDEX[id] && QINDEX[id].mid === mid) ids.add(id); });
  w.appendChild(el(`<div class="kind"><span class="tag check">Lock-in round</span></div>`));
  if (!ids.size) {
    w.appendChild(el(`<h2>Nothing to lock in</h2>`));
    w.appendChild(el(`<p class="lede">You have no open misses in this module. Next: recall it all from memory.</p>`));
    return;
  }
  const queue = shuffle([...ids]);
  const total = queue.length;
  w.appendChild(el(`<h2>Your misses, once more</h2>`));
  const info = el(`<p class="lede">Each question you missed comes back until you get it right. <span class="mono muted" data-left></span></p>`);
  w.appendChild(info);
  const host = el('<div></div>'); w.appendChild(host);
  setNext('Finish the round first', false);
  const skip = el(`<button class="btn ghost small" style="justify-self:start">Skip the round</button>`);
  skip.onclick = () => setNext('Continue');
  w.appendChild(skip);
  function nextQ() {
    host.innerHTML = '';
    $('[data-left]', info).textContent = `${total - queue.length}/${total} locked`;
    if (!queue.length) {
      sfx.win();
      host.appendChild(winBar('All misses locked in', null));
      SESSION.miss[mid] = new Set();
      setNext('Continue'); skip.remove(); return;
    }
    const id = queue.shift();
    renderQ(QINDEX[id].q, host, {
      onAnswer: ok => {
        if (!ok) queue.push(id);
        const nb = el(`<button class="btn small" style="margin-top:12px">${queue.length ? 'Next question' : 'Finish round'} ${I.next}</button>`);
        nb.onclick = nextQ; host.appendChild(nb);
      }
    });
  }
  nextQ();
};

  m.appendChild(el(`<p class="lede" style="margin-top:16px">${q.length ? `<b>${q.length}</b> card${q.length > 1 ? 's' : ''} due now. Missed cards come back first.` : `All caught up. Next review ${nextDueText() || 'soon'}.`}</p>`));
  const row = el('<div style="display:grid;gap:10px;margin-top:14px"></div>');
  if (q.length) { const b = el(`<button class="btn primary block">Review ${q.length} due ${I.next}</button>`); b.onclick = () => go('cards', { start: true }, true); row.appendChild(b); }
  const pr = el(`<button class="btn block">Practice 10 random cards</button>`);
  pr.onclick = () => { R.params = {}; m.innerHTML = ''; runCards(m, shuffle(all).slice(0, 10), true); };
  row.appendChild(pr);
  m.appendChild(row);
};

function runCards(m, queue, practice = false) {
  queue = queue.slice();
  const total = queue.length;
  let done = 0, got = 0;
  const host = el('<div></div>'); m.appendChild(host);
  function show() {
    host.innerHTML = '';
    if (!queue.length) {
      sfx.win();
      host.appendChild(el(`<div class="done"><span class="tag teach">Session done</span><div class="big">${got}/${done}</div><p class="muted">remembered on the first go${practice ? ' (practice does not change your schedule)' : ''}</p></div>`));
      const b = el(`<button class="btn block" style="margin-top:14px">Back to flashcards</button>`); b.onclick = () => go('cards', {}, true);
      host.appendChild(b); return;
    }
    const c = queue[0];
    const mod = modById(c.mid);
    const card = el(`<div class="fc" role="button" tabindex="0" aria-label="Flashcard. Tap to flip.">
      <div class="inner"><div class="face"><span class="eyebrow">Module ${mod.n} · question</span><div class="t">${c.f}</div><div class="meta"><span>tap to flip</span><span>${queue.length} left</span></div></div>
      <div class="face back"><span class="eyebrow">Answer</span><div class="b">${c.b}</div><div class="meta"><span>${esc(mod.title)}</span><span>${boxLabel(c.id)}</span></div></div></div></div>`);
    const flip = () => { card.classList.toggle('flipped'); btns.hidden = false; sfx.tap(); };
    card.onclick = flip; card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
    const btns = el(`<div class="fcbtns" hidden><button class="btn again">${I.x} Again</button><button class="btn got">${I.check} Got it</button></div>`);
    const [again, ok] = $$('button', btns);
    again.onclick = () => { if (!practice) gradeCard(c.id, false); queue.shift(); queue.splice(Math.min(3, queue.length), 0, c); if (!c._seen) { done++; c._seen = 1; } sfx.bad(); show(); };
    ok.onclick = () => { if (!practice) gradeCard(c.id, true); queue.shift(); if (!c._seen) { done++; got++; } delete c._seen; sfx.ok(); show(); };
    host.appendChild(card); host.appendChild(btns);
  }
  show();
}
function boxLabel(id) { const s = S.srs[id]; if (!s) return 'new'; if (s.b < 0) return 'relearning'; return `box ${s.b + 1} · ${INTV[s.b]}d`; }

/* ---------- search ---------- */
let SEARCH = null;
function buildSearch() {
  SEARCH = [];
  MODULES.forEach(m => {
    const c = CONTENT[m.id]; if (!c) return;
    const flow = flowOf(m.id);
    const at = s => flow.findIndex(f => f._i === s);
    c.steps.forEach((s, i) => {
      const where = `Module ${m.n} · ${m.title}`;
      if (s.t === 'card') SEARCH.push({ kind: 'Card', title: s.title, text: strip(s.body.join(' ') + ' ' + (s.cap || '') + ' ' + (s.hook || '') + ' ' + (s.flag || '')), where, go: () => openModule(m.id, at(i)) });
      if (s.t === 'ix') SEARCH.push({ kind: 'Interactive', title: s.title, text: strip(s.intro || ''), where, go: () => openModule(m.id, at(i)) });
      if (s.t === 'q') SEARCH.push({ kind: 'Question', title: strip(s.q.stem), text: strip((s.q.opts ? 'Answer: ' + s.q.opts[0] + ' · ' : '') + (s.q.why || s.q.model || '')), where, go: () => openModule(m.id, at(i)) });
      if (s.t === 'card' && s.fig) (FIGS[s.fig].labels || []).forEach(l => { SEARCH.push({ kind: 'Figure label', title: l.en + ' · ' + l.ar, text: l.note || '', where: where + ' · figure', go: () => openModule(m.id, at(i)), key: s.fig + l.id }); });
    });
    (c.flash || []).forEach(f => SEARCH.push({ kind: 'Flashcard', title: strip(f.f), text: strip(f.b), where: `Module ${m.n} · flashcards`, go: () => go('cards') }));
    (c.hooks || []).forEach(h => SEARCH.push({ kind: 'Memory hook', title: h.t, text: h.d, where: `Module ${m.n} · hooks`, go: () => openModule(m.id, flow.findIndex(f => f.t === 'hooks')) }));
  });
  const seen = new Set();
  SEARCH = SEARCH.filter(x => { const k = x.kind + x.title; if (seen.has(k)) return false; seen.add(k); return true; });
}
function hl(text, terms) {
  let t = esc(text);
  terms.forEach(w => { if (w.length > 1) t = t.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });
  return t;
}
VIEWS.search = (app, params) => {
  app.appendChild(topBar('Search', 'Cards · questions · labels · flashcards'));
  const m = mainEl(); app.appendChild(m);
  if (!SEARCH) buildSearch();
  const box = el(`<div class="search"><div style="position:relative">${I.search}<input id="q-search" type="search" placeholder="Try “pelvis”, “Cowper”, “6.5”" autocomplete="off" aria-label="Search everything"></div></div>`);
  m.appendChild(box);
  const res = el('<div class="results" aria-live="polite"></div>'); m.appendChild(res);
  const inp = $('input', box);
  function run() {
    const q = inp.value.trim().toLowerCase();
    R.params.q = inp.value;
    res.innerHTML = '';
    if (!q) { res.appendChild(el(`<div class="empty"><p>Search ${SEARCH.length} items across every built module. Results show where each one lives; tap to jump there.</p></div>`)); return; }
    const terms = q.split(/\s+/).filter(Boolean);
    const hits = SEARCH.map(x => {
      const T = x.title.toLowerCase(), X = x.text.toLowerCase();
      if (!terms.every(w => T.includes(w) || X.includes(w))) return null;
      return { x, score: terms.reduce((a, w) => a + (T.includes(w) ? 3 : 1), 0) };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 60);
    if (!hits.length) { res.appendChild(el(`<div class="empty"><b>No matches for “${esc(inp.value)}”</b><p>Try a shorter word or the English exam term.</p></div>`)); return; }
    hits.forEach(({ x }) => {
      const snip = x.text.length > 160 ? x.text.slice(0, 160) + '…' : x.text;
      const b = el(`<button class="res"><span class="where">${esc(x.kind)} · ${esc(x.where)}</span><b>${hl(x.title, terms)}</b>${snip ? `<p>${hl(snip, terms)}</p>` : ''}</button>`);
      b.onclick = x.go;
      res.appendChild(b);
    });
  }
  inp.oninput = run;
  if (params.q) inp.value = params.q;
  run();
  setTimeout(() => inp.focus(), 50);
};

/* ---------- mistakes ---------- */
VIEWS.mistakes = (app) => {
  app.appendChild(topBar('My mistakes', 'Stay here until answered right', { back: true }));
  const m = mainEl(); app.appendChild(m);
  const ids = Object.keys(S.mist).filter(id => QINDEX[id]).sort((a, b) => S.mist[b] - S.mist[a]);
  if (!ids.length) { m.appendChild(el(`<div class="empty">${I.check.replace('<svg', '<svg style="width:40px;height:40px;color:var(--teal)"')}<b>No open mistakes</b><p>Questions you miss land here and leave only when you answer them correctly.</p></div>`)); return; }
  const drill = el(`<button class="btn primary block">Drill all ${ids.length} ${I.next}</button>`);
  m.appendChild(drill);
  const list = el('<div class="list" style="margin-top:14px"></div>');
  ids.forEach(id => {
    const { q, mid } = QINDEX[id], mod = modById(mid);
    const b = el(`<button class="res"><span class="where">Module ${mod.n} · ${esc(mod.title)} · missed ${S.qs[id] ? S.qs[id].w : 1}×</span><b>${strip(q.stem)}</b></button>`);
    b.onclick = () => { m.innerHTML = ''; drillList(m, [id]); };
    list.appendChild(b);
  });
  m.appendChild(list);
  drill.onclick = () => { m.innerHTML = ''; drillList(m, shuffle(ids)); };
};
function drillList(m, ids) {
  const host = el('<div></div>'); m.appendChild(host);
  let i = 0;
  function next() {
    host.innerHTML = '';
    if (i >= ids.length) {
      const left = ids.filter(id => S.mist[id]).length;
      host.appendChild(winBar(left ? `${ids.length - left} fixed · ${left} still open` : 'All fixed', null));
      const b = el(`<button class="btn block" style="margin-top:12px">Back to mistakes</button>`); b.onclick = () => go('mistakes', {}, true);
      host.appendChild(b); return;
    }
    host.appendChild(el(`<p class="eyebrow" style="margin-bottom:10px">${i + 1} of ${ids.length}</p>`));
    renderQ(QINDEX[ids[i]].q, host, { onAnswer: () => { const b = el(`<button class="btn primary small" style="margin-top:12px">${i + 1 < ids.length ? 'Next' : 'Finish'} ${I.next}</button>`); b.onclick = () => { i++; next(); }; host.appendChild(b); } });
  }
  next();
}

/* ---------- more / settings / arabic / soon ---------- */
VIEWS.more = (app) => {
  app.appendChild(topBar('More', 'Tools and settings'));
  const m = mainEl(); app.appendChild(m);
  m.appendChild(toolsSection());
};

VIEWS.settings = (app) => {
  app.appendChild(topBar('Settings', 'Saved on this device', { back: true }));
  const m = mainEl(); app.appendChild(m);
  const box = el('<div class="list"></div>'); m.appendChild(box);
  function seg(key, opts, title, desc, after) {
    const s = el(`<div class="set"><h3>${title}</h3>${desc ? `<p>${desc}</p>` : ''}<div class="seg" role="group" aria-label="${esc(title)}">${opts.map(([v, l]) => `<button data-v="${v}" aria-pressed="${S.set[key] === v}">${l}</button>`).join('')}</div></div>`);
    $$('button', s).forEach(b => b.onclick = () => { let v = b.dataset.v; if (v === 'true') v = true; if (v === 'false') v = false; S.set[key] = v; save(); after && after(); render(); });
    box.appendChild(s);
  }
  seg('theme', [['auto', 'Auto'], ['dark', 'Dark'], ['light', 'Light']], 'Theme', 'Auto follows your device.', applyTheme);
  seg('qmode', [['inline', 'After each idea'], ['end', 'End of module']], 'Question placement', 'Inline questions test each idea right after you learn it. End-of-module puts them all in one round.');
  seg('sound', [[true, 'On'], [false, 'Off']], 'Sound effects', 'Soft monitor tones for right and wrong answers.');
  seg('arLabels', [[false, 'English'], [true, 'العربية']], 'Figure labels', 'Language of the labels drawn on anatomy figures.');
  const reset = el(`<div class="set"><h3>Reset progress</h3><p>Clears module progress, answers, mistakes and flashcard schedule on this device.</p><button class="btn danger" data-r>Reset everything</button></div>`);
  let armed = false;
  $('[data-r]', reset).onclick = e => {
    if (!armed) { armed = true; e.target.textContent = 'Tap again to confirm reset'; setTimeout(() => { armed = false; e.target.textContent = 'Reset everything'; }, 4000); return; }
    const keep = S.set; Object.keys(S).forEach(k => delete S[k]); Object.assign(S, defaults(), { set: keep }); save(); toast('Progress cleared'); R.stack = []; go('home', {}, true);
  };
  box.appendChild(reset);
  box.appendChild(el(`<p class="muted" style="font-size:12.5px">Source: Chapter 22 slide decks (files A and B). “Beyond your notes” marks anything added from standard references. ⚑ marks where your notes differ from standard references; the site keeps your notes’ version for the exam.</p>`));
};

};
